name: regenerate-pr143-artifacts

on:
  push:
    branches:
      - claude/jolly-brown-xjnq7f

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: claude/jolly-brown-xjnq7f
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Regenerate deterministic agent artifacts
        run: |
          set -euo pipefail
          python -m pip install "jinja2>=3.1"
          python -m minefield agent-bundle
          python community/generate_impact.py --check
      - name: Commit generated files and remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist minefield/data registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          git rm .github/workflows/regenerate-pr143-artifacts.yml
          git commit -m "ci: regenerate 0.2.1 artifacts"
          git push origin HEAD:claude/jolly-brown-xjnq7f
