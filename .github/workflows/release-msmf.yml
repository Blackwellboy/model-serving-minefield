name: release-msmf

# Runs only on a pushed alias tag (msmf-v0.1.0, ...). This does not affect the
# main release workflow or tag scheme.
#
# PyPI publishing uses trusted publishing (OIDC): no API token is stored.
# Before the first msmf tag, add this Trusted Publisher on PyPI for project "msmf":
#   - Provider: GitHub
#   - Owner: Blackwellboy
#   - Repository: model-serving-minefield
#   - Workflow file: release-msmf.yml
#   - Environment: pypi
#   - Project on PyPI: msmf
# The environment "pypi" must exist in this repo (Settings > Environments) and
# can optionally require reviewers.
# Until the Trusted Publisher is approved on PyPI, the publish job will fail
# at token exchange but upload nothing.

on:
  push:
    tags: ["msmf-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: tag must match alias package version
        working-directory: packages/msmf
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "msmf-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/msmf/pyproject.toml version $version"
            exit 1
          fi
      - name: build msmf wheel/sdist
        working-directory: packages/msmf
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: install built wheel in a clean venv and smoke test CLIs
        working-directory: packages/msmf
        run: |
          python -m venv "$RUNNER_TEMP/msmf-wheel-env"
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/msmf-wheel-env/bin/minefield" --help >/dev/null
          # Basic import check to ensure dependency installed and importable
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -c "import minefield; print(minefield.__name__)"
      - name: upload msmf artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msmf-python-package-distributions
          path: |
            packages/msmf/dist/*.whl
            packages/msmf/dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/msmf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msmf-python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

