name: one-shot-scottleimroth-intake

on:
  push:
    branches: [maint/scottleimroth-intake-20260824]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write maintainer integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          trap125 = r'''# Trap 125: cgroup v2 `MemoryMax` does not account DGX Spark CUDA unified-memory allocations

**Found by @scottleimroth.**

**Status: contributor-measured, conditions as reported** ([issue #57](https://github.com/Blackwellboy/model-serving-minefield/issues/57)). The contributor measured the CUDA and host-allocation controls on DGX Spark; Blackwellboy has not independently reproduced this lane.

**Symptom.** A systemd/cgroup v2 `MemoryMax` guard around a model server looks armed, but a CUDA allocation can grow beyond the configured limit without the cgroup killing the process. On the reported DGX Spark test, a 12 GiB CUDA allocation completed inside an 8 GiB `MemoryMax` scope while `memory.current` only reached about 409 MiB. A plain host-memory control in the same scope shape was killed at the limit.

**Mechanism.** On the measured GB10 unified-memory path, the CUDA driver-side allocation was not charged to the cgroup's `memory.current` in proportion to the physical memory it consumed. The cgroup therefore had nothing equivalent to the CUDA footprint to enforce against. The small rise that was visible was consistent with bookkeeping/page-table overhead, not the allocation itself. This is a measured platform/runtime behavior, not a claim that every CUDA or every unified-memory implementation behaves this way.

**Stacks and builds bitten.** NVIDIA DGX Spark / GB10 (`sm_121`), Ubuntu 24.04 aarch64, cgroup v2 with the memory controller delegated to the user slice; CUDA allocations observed from a vLLM 0.26-line serve and a standalone PyTorch allocator. The contributor used `systemd-run --user --scope -p MemoryMax=8G -p MemorySwapMax=0`. Broader Grace-Blackwell or CUDA-UMA applicability is unmeasured here.

**The check.** First prove the limiter itself with a positive control: run a plain host allocator in an 8 GiB scope with `MemorySwapMax=0`, grow in 1 GiB steps, and require an exit near the limit plus an `oom_kill` increment in `memory.events`. Then repeat the same growth pattern with CUDA while watching both `memory.current` and `/proc/meminfo` `MemAvailable`. If physical available memory falls with the CUDA allocation while `memory.current` remains far below the configured cap and no cgroup OOM event fires, `MemoryMax` is not a valid CUDA guard on that lane. Do not omit the swap control: with swap allowed, even the host control can survive and make a broken test look healthy.

**The fix.** Do not treat `MemoryMax` as the sole last-resort guard for CUDA unified-memory pressure on a lane that reproduces this check. The contributor's measured workaround is an off-box or independent watchdog on `/proc/meminfo` `MemAvailable`, using consecutive-breach hysteresis so legitimate load/KV transients do not trigger a kill. When terminating a failed serve, also account for child GPU-owning processes rather than assuming the API-server PID owns all allocations; see [Trap 123](../runtime/123-vllm-v1-enginecore-orphan-holds-gpu-memory.md).

**Found.** 2026-08-23 while testing a safety guard motivated by DGX Spark unified-memory over-allocation risk.

**Attribution.** @scottleimroth. Original measured report and controls: [issue #57](https://github.com/Blackwellboy/model-serving-minefield/issues/57). Related: [Trap 13](13-utilization-fraction-on-unified-memory.md), [Trap 96](96-list-devices-reports-host-memory-as-device-free-memory.md), [Trap 115](../evaluation/115-exit-137-is-not-oom-killer-proof.md), [Trap 123](../runtime/123-vllm-v1-enginecore-orphan-holds-gpu-memory.md).
'''

          trap126 = r'''# Trap 126: Ling `thinking:false` can keep reasoning enabled and spill the trace into `content`

**Found by @scottleimroth.**

**Status: contributor-measured, conditions as reported** ([issue #58](https://github.com/Blackwellboy/model-serving-minefield/issues/58)). The contributor measured the free-text and structured-output controls on DGX Spark; Blackwellboy has not independently reproduced this lane.

**Symptom.** Setting `chat_template_kwargs: {"thinking": false}` on a Ling-3.0-flash free-text request does not produce the expected faster/non-reasoning path. Token cost stays essentially unchanged, while the reasoning trace is delivered at the front of `content` and a stray `</think>` separates it from the user-facing answer. The same toggle behaves differently when the request asks for structured JSON output.

**Mechanism.** On the reported Ling serving path, `thinking:false` in ordinary free-text does not suppress the model's reasoning work; it changes where the generated trace is separated. The contributor's short control measured 81 completion tokens with thinking on versus 80 with thinking off for the same task, while the off response contained the combined reasoning-plus-answer text in `content`. Under `response_format: {"type": "json_object"}`, the same flag did suppress the extra reasoning work and reduced the measured completion from 33 tokens to 12. The important boundary is therefore response-shape dependent on this stack: a toggle accepted by the API is not one stable semantic contract across free text and structured output.

**Stacks and builds bitten.** `inclusionAI/Ling-3.0-flash-int4` on inclusionAI's `vllm-ling-v3` fork (reported branch `ling_3_0`, Ling-3 reasoning parser), NVIDIA DGX Spark / GB10, aarch64, served using the DGX-Spark Ling recipe referenced by the contributor. The contributor also notes that stock vLLM is not a valid control for this model family because that route silently produces incorrect output; this entry is scoped to the working inclusionAI fork path they measured.

**The check.** Send the same small free-text prompt twice with every other request field frozen: once with thinking enabled and once with `thinking:false`. Compare completion tokens and inspect both `content` and the reasoning field. A failing lane shows near-equal token work while the off arm moves reasoning text into `content` with a dangling close tag. Then repeat the same pair under `response_format: {"type": "json_object"}`. If the structured arm becomes materially cheaper/clean while free text does not, the toggle is response-shape dependent rather than globally broken.

**The fix.** On the measured free-text path, do not use `thinking:false` as a latency/cost optimization and do not assume it guarantees clean answer-only `content`. Prefer the working reasoning-on separation for ordinary text, or use the structured-output path when its semantics fit the application and its off behavior has been verified. If a client must consume the broken free-text off path, treat the visible reasoning prefix/`</think>` as a parser defect to fail or sanitize, not as model answer content.

**Found.** 2026-08-23 while benchmarking Ling-3.0-flash on DGX Spark.

**Attribution.** @scottleimroth. Original measured report and controls: [issue #58](https://github.com/Blackwellboy/model-serving-minefield/issues/58). Related: [Trap 02](../template/02-orphaned-think-close-tag.md) for the close-tag symptom, [Trap 29](29-server-reasoning-off-is-not-an-off-switch.md) for a different off-switch contract failure, and [Trap 64](64-answer-lands-in-reasoning-on-toggle-conflict.md) for the opposite field-placement failure.
'''

          (root/'traps/memory/125-cgroup-memorymax-does-not-account-gb10-cuda-uma.md').write_text(trap125, encoding='utf-8')
          (root/'traps/reasoning/126-ling-thinking-false-spills-reasoning-into-content.md').write_text(trap126, encoding='utf-8')

          # Queue both live [trap] issues so the issue-state integrity gate remains true until merge/closure.
          oq = root/'mining/OPEN_QUESTIONS.md'
          text = oq.read_text(encoding='utf-8')
          marker = '\n---\n\n## CLOSED, so nobody re-opens them\n'
          assert marker in text
          qblock = r'''
### Q18. Does cgroup v2 `MemoryMax` fail to account CUDA unified-memory pressure on DGX Spark as reported in issue #57?

- **Claim under test.** [Issue #57](https://github.com/Blackwellboy/model-serving-minefield/issues/57) reports that an 8 GiB cgroup v2 `MemoryMax` scope allowed a 12 GiB CUDA allocation on DGX Spark while `memory.current` remained around 409 MiB; the same limiter killed a plain host allocator at the expected boundary.
- **Source.** PRIMARY for the contributor's measured controls, attributed to @scottleimroth. This is not Blackwellboy reproduction.
- **Needs.** A disposable DGX Spark / GB10 lane with delegated cgroup v2 memory control; no model quality workload is required.
- **CONFIRM.** With `MemorySwapMax=0`, a host-allocation positive control is killed at the configured cap with an `oom_kill` event, while a matched CUDA allocation materially reduces `MemAvailable` yet remains largely absent from `memory.current` and passes the same `MemoryMax` boundary.
- **REFUTE.** CUDA physical memory pressure is charged into `memory.current` closely enough that the same `MemoryMax` boundary kills the CUDA allocator, or the host positive control itself does not enforce under the supposedly matched scope.
- **Cost.** S; two bounded allocators plus counters.
- **Note.** Maintainer adjudication finds this distinct from Trap 13 (fractional UMA reservation) and Trap 96 (misreported free-device memory). Canonical promotion is staged as Trap 125 on the maintainer branch, pending CI/merge.

### Q19. Is Ling-3.0-flash `thinking:false` response-shape dependent as reported in issue #58?

- **Claim under test.** [Issue #58](https://github.com/Blackwellboy/model-serving-minefield/issues/58) reports that free-text `thinking:false` leaves reasoning work essentially unchanged and spills the trace into `content`, while the same flag under JSON structured output materially reduces completion tokens and yields clean structured content.
- **Source.** PRIMARY for the contributor's measured request pairs, attributed to @scottleimroth. This is not Blackwellboy reproduction.
- **Needs.** The working inclusionAI Ling-3.0 serving fork on a disposable lane; stock vLLM is not an equivalent control for this model according to the contributor's report.
- **CONFIRM.** On a pinned working fork/model, matched free-text on/off requests show near-equal token work and reasoning spill into `content` only in the off arm, while a matched JSON response-format pair shows a materially cheaper clean off path.
- **REFUTE.** Free-text off actually suppresses reasoning/token work, or structured-output off behaves the same as the broken free-text path once request shape and parser configuration are pinned.
- **Cost.** S; four small requests plus response-field inspection.
- **Note.** The close-tag symptom overlaps Trap 02, but the response-shape-dependent toggle semantics are not owned by Trap 02, 29 or 64. Canonical promotion is staged as Trap 126 on the maintainer branch, pending CI/merge.

'''
          text = text.replace(marker, '\n' + qblock + marker, 1)
          oq.write_text(text, encoding='utf-8')

          # README: current-count prose and symptom rows.
          p = root/'README.md'
          text = p.read_text(encoding='utf-8')
          replacements = {
              'checks\nfor **19 of these 124 entries**,': 'checks\nfor **19 of these 126 entries**,',
              'nothing about the other 105.': 'nothing about the other 107.',
              'All 124 entries.': 'All 126 entries.',
              "against 19 of this registry's 124 entries": "against 19 of this registry's 126 entries",
          }
          for a,b in replacements.items():
              assert a in text, a
              text = text.replace(a,b)
          anchor = '| Output contains a stray ` /think` you never sent, breaking exact-match scoring | The mirror case: the template appends the marker to the last user message and it leaks | [66 (injection)](traps/template/66-in-text-thinking-toggle-mutates-user-text.md#the-mirror-case-injection-on-ollama) | reproduced here |\n'
          assert anchor in text
          rows = ('| An 8 GiB cgroup memory cap stays green while CUDA consumes 12 GiB of unified memory | `MemoryMax` is not accounting the CUDA UMA allocation on the measured GB10 path | [125](traps/memory/125-cgroup-memorymax-does-not-account-gb10-cuda-uma.md) | contributor-measured, conditions as reported |\n'
                  '| `thinking:false` costs the same and dumps the reasoning trace into the reply, but works under JSON output | Ling free-text thinking-off changes separation rather than suppressing reasoning on the measured fork | [126](traps/reasoning/126-ling-thinking-false-spills-reasoning-into-content.md) | contributor-measured, conditions as reported |\n')
          text = text.replace(anchor, anchor + rows, 1)
          p.write_text(text, encoding='utf-8')

          # Per-model index: add Ling row before DeepSeek row.
          p = root/'models/README.md'
          text = p.read_text(encoding='utf-8')
          anchor = '| DeepSeek V4-Flash (MTP builds; upstream reports) |'
          assert anchor in text
          row = '| inclusionAI Ling-3.0-flash-int4 (inclusionAI `vllm-ling-v3` fork, DGX Spark / GB10) | [126](../traps/reasoning/126-ling-thinking-false-spills-reasoning-into-content.md) *(contributor-measured, conditions as reported)* |\n'
          text = text.replace(anchor, row + anchor, 1)
          p.write_text(text, encoding='utf-8')

          # Hall of Fame credit before Blackwellboy row.
          p = root/'HALL_OF_FAME.md'
          text = p.read_text(encoding='utf-8')
          anchor = '| **Blackwellboy** ([laguna-s21-lab]'
          assert anchor in text
          row = '| **@scottleimroth** | Two DGX Spark findings contributed with matched controls: cgroup v2 `MemoryMax` failing to account CUDA unified-memory allocations on GB10, and Ling-3.0-flash `thinking:false` preserving free-text reasoning work while spilling the trace into `content` even though the same flag works under JSON structured output | [125](traps/memory/125-cgroup-memorymax-does-not-account-gb10-cuda-uma.md), [126](traps/reasoning/126-ling-thinking-false-spills-reasoning-into-content.md) |\n'
          text = text.replace(anchor, row + anchor, 1)
          p.write_text(text, encoding='utf-8')

          # Changelog newest note.
          p = root/'CHANGELOG.md'
          text = p.read_text(encoding='utf-8')
          insert = '''\n## 2026-08-24 — traps 125-126: community DGX Spark memory guard + Ling thinking-off semantics\n\n- **Trap 125**, found by **@scottleimroth**: on the measured DGX Spark / GB10 cgroup-v2 path, `MemoryMax` did not account CUDA unified-memory allocations strongly enough to enforce the cap; a plain host-allocation positive control did. Scope stays contributor-measured and GB10-specific.\n- **Trap 126**, found by **@scottleimroth**: on inclusionAI's working Ling-3.0 fork, free-text `thinking:false` left reasoning token work essentially unchanged and spilled the trace into `content`, while the same toggle under JSON structured output materially reduced tokens.\n- Issues #57 and #58 are preserved in the preregistered open queue until the maintainer integration lands and the issue lifecycle can be closed cleanly.\n\n'''
          heading = '# Changelog\n'
          assert heading in text
          text = text.replace(heading, heading + insert, 1)
          p.write_text(text, encoding='utf-8')

          # Current registry-count prose outside generated bundles.
          for rel in ['doctor/README.md','playbooks/README.md']:
              p = root/rel
              t = p.read_text(encoding='utf-8')
              t = t.replace('19 of 124', '19 of 126').replace('19 / 124', '19 / 126')
              t = t.replace('105 uncovered', '107 uncovered').replace('105 entries', '107 entries')
              t = t.replace('124 canonical', '126 canonical').replace('124 entries', '126 entries')
              p.write_text(t, encoding='utf-8')

          p = root/'doctor/minefield_doctor.py'
          t = p.read_text(encoding='utf-8')
          t = t.replace('REGISTRY_TOTAL = 124', 'REGISTRY_TOTAL = 126')
          t = t.replace('TOTAL_TRAPS = 124', 'TOTAL_TRAPS = 126')
          t = t.replace('19 of 124', '19 of 126')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Regenerate official derived surfaces
        run: |
          python3 -m minefield agent-bundle

      - name: Remove one-shot workflow and commit generated tree
        run: |
          rm -f .github/workflows/oneshot-scottleimroth-intake.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Integrate scottleimroth DGX Spark and Ling findings" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
