name: temporary-qwen38-reconcile

on:
  push:
    branches:
      - maint/qwen38-reconcile-37-40-20260817
    paths:
      - .github/workflows/temporary-qwen38-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-and-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Reconcile lead catalogue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path('leads/LEADS.json'), Path('minefield/data/UNVERIFIED_LEADS.json')]
          note_ref = '../mining/2026-08-17-qwen38-offlabel-reconciliation.md'

          new_lead = {
              'id': 'L049',
              'title': 'Requested NVFP4 backend can differ from the effective kernel on SM121',
              'canonical': False,
              'status': 'PUBLIC_SOURCE_UNREPRODUCED',
              'source_class': 'community_public_source',
              'scope': 'quantization_runtime',
              'symptom': 'A GB10/SM121 NVFP4 serve is incoherent under one backend setting and coherent after requesting another backend, but configuration intent alone does not prove which kernel actually ran.',
              'possible_mechanism': 'Backend-selection controls may be build/version specific or ignored, so a requested Marlin-versus-default A/B can accidentally compare the same effective kernel or attribute a build-scoped correctness difference too broadly.',
              'confirmation_check': 'Pin the exact image/build and model revision, prove the effective kernel/backend from runtime evidence on both arms, then run identical correctness canaries before comparing speed or coherence.',
              'refutation_check': 'Show the requested controls are recognized, both arms use the intended distinct effective backends, and the reported coherence difference does not reproduce under the same checkpoint/request.',
              'conditional_mitigation': 'Do not force or recommend a backend from flag names alone; use only a backend path whose effective kernel and correctness are proven on the pinned build.',
              'related_traps': ['09', '10', '27'],
              'affected_stacks': ['vLLM', 'DGX Spark GB10', 'SM121', 'NVFP4'],
              'source_refs': [note_ref, 'https://github.com/Blackwellboy/model-serving-minefield/issues/40'],
              'confidence': 'medium',
              'notes': 'The public-source coherence claim remains unreproduced here. A separate first-party Qwen3.8 check found requested Marlin controls unrecognized on its tested build, sharpening the required requested-versus-effective-backend check without reproducing the external result.'
          }

          for path in paths:
              data = json.loads(path.read_text())
              leads = data['leads']
              if not any(item['id'] == 'L049' for item in leads):
                  leads.append(new_lead)
              l003 = next(item for item in leads if item['id'] == 'L003')
              if note_ref not in l003['source_refs']:
                  l003['source_refs'].append(note_ref)
              extra = 'Qwen3.8 speculative-launch admission is a build/config-scoped extension: resource admission failure must not be generalized into a model-wide MTP unsupported claim.'
              if extra not in l003.get('notes', ''):
                  l003['notes'] = (l003.get('notes', '').strip() + ' ' + extra).strip()
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Compile and run full tests
        run: |
          python -m compileall -q minefield tests
          python -m unittest discover -s tests
          python integrity/registry_integrity.py

      - name: Regenerate and verify official surfaces
        run: |
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify

      - name: Commit deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'NO_GENERATED_DIFF=YES'
            exit 0
          fi
          git commit -m 'Reconcile Qwen3.8 Offlabel leads and generated surfaces'
          git push origin HEAD:${GITHUB_REF_NAME}
