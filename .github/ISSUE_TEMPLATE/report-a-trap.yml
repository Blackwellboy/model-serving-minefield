name: I hit a trap
description: You lost time to a serving or config bug. Four plain questions, no writeup. A maintainer turns it into an entry and credits you.
title: "[trap] "
labels: ["trap-report"]
body:
  - type: markdown
    attributes:
      value: |
        Plain words are fine. No formatting, no evidence checklist, no finished writeup.
        Answer these the way you would tell a friend what happened. A maintainer will
        verify what can be verified, write the entry, credit you by the handle you
        publish under, and link back to this issue. "I am not sure this is even a trap"
        is a fine reason to open one.
  - type: textarea
    id: what-broke
    attributes:
      label: What broke
      description: The short version of what went wrong.
      placeholder: "Tool calling just stopped working after I switched containers."
    validations:
      required: true
  - type: textarea
    id: what-you-saw
    attributes:
      label: What you saw
      description: The symptom in your own words. The weird number, the strange output, the thing that made you doubt yourself.
      placeholder: "Every reply started with a stray </think> and my parser choked on it."
    validations:
      required: true
  - type: textarea
    id: what-fixed-it
    attributes:
      label: What fixed it
      description: If you found a fix or workaround, what was it? "Still broken" is a valid answer.
    validations:
      required: false
  - type: textarea
    id: what-serving
    attributes:
      label: What were you serving
      description: Model, quantization, serving stack, and versions, as best you know them.
      placeholder: "Qwen 3.6 35B-A3B, NVFP4, vLLM 0.25.1 in docker on a DGX Spark"
    validations:
      required: true
