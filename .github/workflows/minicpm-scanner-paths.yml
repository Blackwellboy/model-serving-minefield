name: one-shot sanitized scanner paths
on:
  push:
    branches:
      - feature/minicpm-162-163-current-20261013
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - name: Print only scanner paths, line numbers, and detector types
        run: |
          python -m pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-lines 'content_sha256' > "$RUNNER_TEMP/scan.json"
          python - "$RUNNER_TEMP/scan.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          for path, items in sorted(data.get("results", {}).items()):
              for item in items:
                  print("SCANNER_LOCATION",path,"line",item.get("line_number"),"type",item.get("type"))
          PY
      - name: Remove temporary diagnostic workflow
        run: |
          rm .github/workflows/minicpm-scanner-paths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove temporary sanitized scanner inspection"
          git push
