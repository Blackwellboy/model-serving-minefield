name: one-shot-regenerate-scottleimroth

on:
  push:
    branches: [maint/scottleimroth-intake-20260824]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Regenerate official derived surfaces
        run: python3 -m minefield agent-bundle
      - name: Commit regenerated surfaces and remove helper
        run: |
          rm -f .github/workflows/oneshot-regenerate-scottleimroth.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Minefield surfaces for traps 125 and 126" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
