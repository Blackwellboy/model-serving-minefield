name: patch-public-governance-path

on:
  push:
    branches:
      - ops/remove-public-mining-20260830
    paths:
      - .github/workflows/patch-public-governance-path.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/remove-public-mining-20260830
          fetch-depth: 0
      - name: Move test fixture parent from mining to registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrity/tests/test_mutations.py')
          t = p.read_text(encoding='utf-8')
          old = 'return os.path.join(self.root, "mining", "OPEN_TRAP_ISSUES.md")'
          new = 'return os.path.join(self.root, "registry", "OPEN_TRAP_ISSUES.md")'
          if old not in t:
              raise SystemExit('old governance fixture path not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'blackwellboy-privacy-bot'
          git config user.email '76774064+Blackwellboy@users.noreply.github.com'
          git add integrity/tests/test_mutations.py
          git commit -m 'privacy: point count-integrity fixture at public registry governance'
          git push origin HEAD:ops/remove-public-mining-20260830
