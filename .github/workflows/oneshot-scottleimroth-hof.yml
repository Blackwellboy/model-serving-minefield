name: one-shot-scottleimroth-hof

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'maint/scottleimroth-intake-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Update existing contributor credit row
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HALL_OF_FAME.md')
          t=p.read_text(encoding='utf-8')
          old='| **@scottleimroth** | Startup env unvalidated control (issue #19) and process-liveness-vs-model-readiness false positive/negative (issue #21) | [77](traps/reasoning/77-only-one-request-field-is-validated.md), [112](traps/runtime/112-process-liveness-is-not-model-readiness.md) |'
          new='| **@scottleimroth** | Startup env unvalidated control (issue #19), process-liveness-vs-model-readiness false positive/negative (issue #21), plus two controlled DGX Spark findings: cgroup v2 `MemoryMax` failing to account the measured CUDA unified-memory allocation, and Ling-3.0-flash `thinking:false` preserving free-text reasoning work while spilling the trace into `content` even though the same flag works under JSON structured output | [77](traps/reasoning/77-only-one-request-field-is-validated.md), [112](traps/runtime/112-process-liveness-is-not-model-readiness.md), [125](traps/memory/125-cgroup-memorymax-does-not-account-gb10-cuda-uma.md), [126](traps/reasoning/126-ling-thinking-false-spills-reasoning-into-content.md) |'
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          python3 -m minefield agent-bundle
          rm -f .github/workflows/oneshot-scottleimroth-hof.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Credit scottleimroth for traps 125 and 126" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
