name: Something else
description: A question, a correction, a broken link, a doctor bug, a disagreement with an entry, or anything the trap form does not fit.
title: "[misc] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This form exists so that blank issues can stay off. Blank issues route
        around the redaction warning on the trap form, and that warning is the
        whole reason the form is not optional.

        **Same rule here: this issue is public and permanent.** If you are
        pasting a log, a traceback or a config, first remove hostnames, IP
        addresses, absolute paths, usernames, tokens, API keys and internal
        URLs. Replace them with `HOST`, `/PATH`, `REDACTED`. The worked example
        is on the [trap form](?template=report-a-trap.yml), and nothing that
        matters to us is lost by redacting.

        **Do not use this form to report a leaked credential.** Rotate it, then
        read
        [SECURITY.md](https://github.com/Blackwellboy/model-serving-minefield/blob/main/SECURITY.md).
        If the only private channel you can find is a public issue, say
        "I need to report something privately" and nothing else, with no detail
        and no quote of what leaked.
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Scrub check
      options:
        - label: I have removed hostnames, IPs, absolute paths, usernames, tokens and keys from anything I am pasting below, or I am not pasting a log.
          required: true
  - type: textarea
    id: body
    attributes:
      label: What is on your mind
      description: Plain words are fine. If it is a correction to an entry, link the entry and say what is wrong with it; being told we are wrong is the point of publishing conditions.
    validations:
      required: true
