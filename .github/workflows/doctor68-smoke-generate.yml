name: one-shot Doctor 68 smoke and regeneration
on:
  push:
    branches:
      - feature/doctor68-observability-20261013
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile and exercise Doctor suite
        run: |
          python -m compileall -q doctor minefield
          python -m unittest discover -s doctor/tests -p 'test_doctor_verdicts.py' -v
      - name: Regenerate derived surfaces
        run: |
          python -m pip install "jinja2>=3.1"
          python -m minefield agent-bundle
      - name: Remove workflow and commit generated tree
        run: |
          rm .github/workflows/doctor68-smoke-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: regenerate Doctor 68 surfaces"
          git push
