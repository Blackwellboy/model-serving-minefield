name: one-shot-fix-59-count

on:
  push:
    branches: [maint/scottleimroth-intake-20260824]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Bump guarded doctor registry total
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('doctor/minefield_doctor.py')
          t=p.read_text(encoding='utf-8')
          assert 'REGISTRY_TRAP_COUNT = 124' in t
          p.write_text(t.replace('REGISTRY_TRAP_COUNT = 124','REGISTRY_TRAP_COUNT = 126',1),encoding='utf-8')
          PY
          python3 -m minefield agent-bundle
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/oneshot-fix-59-count.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Bump Minefield registry total to 126" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
