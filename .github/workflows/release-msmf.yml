name: release-msmf

# Publishes the thin alias package "msmf" to PyPI on tags "msmf-v*".
# This workflow is separate from the main release workflow for
# "model-serving-minefield" (which triggers on "v*").
#
# PyPI trusted publisher (OIDC) setup required BEFORE the first tag:
#   PyPI project: msmf
#   Owner: Blackwellboy
#   Repository: Blackwellboy/model-serving-minefield
#   Workflow file: .github/workflows/release-msmf.yml
#   Environment: pypi
# On GitHub, ensure the "pypi" Environment exists (Settings → Environments)
# and requires a reviewer. The action will request approval before upload.
#
# This workflow ONLY builds packages/msmf and verifies that installing the
# built wheel pulls model-serving-minefield from PyPI and exposes the
# console scripts "minefield" and "minefield-mcp".

on:
  push:
    tags: ["msmf-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: tag must match the msmf package version
        working-directory: packages/msmf
        run: |
          version="$(python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          expected="msmf-v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/msmf/pyproject.toml version $version (expected $expected)"
            exit 1
          fi

      - name: build msmf (alias) and run Twine checks
        working-directory: packages/msmf
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: verify fresh venv installs minefield via dependency
        working-directory: packages/msmf
        run: |
          python -m venv "$RUNNER_TEMP/msmf-wheel-env"
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -m pip install dist/*.whl
          # Confirm dependency was fetched from PyPI and scripts work
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" -m pip show model-serving-minefield
          export PATH="$RUNNER_TEMP/msmf-wheel-env/bin:$PATH"
          minefield --help >/dev/null
          minefield-mcp --help >/dev/null
          "$RUNNER_TEMP/msmf-wheel-env/bin/python" - <<'PY'
          import minefield, sys
          assert "site-packages" in minefield.__file__, minefield.__file__
          sys.stdout.write("OK\n")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            packages/msmf/dist/*.whl
            packages/msmf/dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/msmf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

