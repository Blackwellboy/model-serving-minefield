# Public issue form: research-stack / measurement integrity failures.
# Do not submit secrets, private bounty targets, or embargoed exploit detail.
name: Research-stack or measurement failure
description: Report a harness, scorer, agent-evidence, or serving-measurement integrity failure (sanitized).
title: "[research-integrity] "
labels: ["research-integrity"]
body:
  - type: markdown
    attributes:
      value: |
        ## Public and permanent

        Scrub secrets, credentials, private hostnames, customer data, private
        infrastructure addresses, and embargoed vulnerability detail **before**
        posting. Prefer sanitized aliases over private target names.

        Do **not** submit exploit payloads prohibited by disclosure terms.

        A submission may become: existing-trap corroboration, trap extension,
        check, mining question, unnumbered draft, upstream-tier item,
        good-practice note, or rejected duplicate. **No trap number is promised.**

        See playbook
        [`playbooks/agentic-research-integrity.md`](../../blob/main/playbooks/agentic-research-integrity.md).

  - type: dropdown
    id: failure_class
    attributes:
      label: Failure class
      options:
        - RESEARCH_STACK_FAILURE
        - HARNESS_FAILURE
        - SERVING_MEASUREMENT_FAILURE
        - AGENT_EVIDENCE_FAILURE
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: Observed symptom
      description: What you saw (sanitized).
    validations:
      required: true

  - type: textarea
    id: stack_concluded
    attributes:
      label: What the research stack initially concluded
      description: The (possibly wrong) conclusion the agent/harness/report produced.
    validations:
      required: true

  - type: textarea
    id: actually_happened
    attributes:
      label: What actually happened
      description: Best current understanding after review of raw evidence.
    validations:
      required: true

  - type: input
    id: runtime_tools
    attributes:
      label: Runtime / tool / harness involved
      description: Public names and versions where safe.
    validations:
      required: true

  - type: input
    id: exact_revision
    attributes:
      label: Exact public version/revision (where safe)
      description: Prefer full git SHA or immutable tag. Avoid bare "main".
    validations:
      required: false

  - type: textarea
    id: minimal_repro
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: Positive and negative controls
      description: Include whether controls shared the same harness/workspace.
    validations:
      required: true

  - type: textarea
    id: raw_evidence
    attributes:
      label: Raw shareable evidence
      description: Links or redacted excerpts. Hashes welcome. No secrets.
    validations:
      required: false

  - type: textarea
    id: prevention
    attributes:
      label: What would have prevented the mistake
    validations:
      required: false

  - type: input
    id: attribution
    attributes:
      label: Desired attribution
      description: How you want to be credited (or "anonymous").
    validations:
      required: false
