name: fingerprint matcher benchmark

on:
  push:
    branches:
      - feature/structured-fingerprints-20261008

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python benchmarks/run_symptom_benchmark.py --json
