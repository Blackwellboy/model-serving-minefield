name: one-shot fingerprint benchmark v2

on:
  push:
    branches:
      - feature/fingerprints-doctor29-20261008

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Benchmark fingerprints
        run: |
          python benchmarks/run_symptom_benchmark.py
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/fingerprint-benchmark-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: remove fingerprint benchmark v2"
          git push
