name: regenerate-after-privacy-migration

on:
  push:
    branches:
      - ops/remove-public-mining-20260830
    paths:
      - .github/workflows/regenerate-after-privacy-migration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/remove-public-mining-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate deterministic public artifacts
        run: |
          set -euo pipefail
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
          git diff --check
      - name: Commit regenerated artifacts
        run: |
          set -euo pipefail
          git config user.name 'blackwellboy-privacy-bot'
          git config user.email '76774064+Blackwellboy@users.noreply.github.com'
          git add dist minefield/data registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo 'No generated drift to commit.'
            exit 0
          fi
          git commit -m 'generated: refresh artifacts after private mining removal'
          git push origin HEAD:ops/remove-public-mining-20260830
