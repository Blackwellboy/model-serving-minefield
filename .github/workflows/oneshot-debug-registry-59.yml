name: one-shot-debug-registry-59

on:
  push:
    branches: [maint/scottleimroth-intake-20260824]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Capture exact registry findings
        run: python3 integrity/registry_integrity.py > .registry-debug-59.txt 2>&1 || true
      - name: Commit debug output and remove helper
        run: |
          rm -f .github/workflows/oneshot-debug-registry-59.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Capture registry integrity findings for PR 59" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
