name: temporary-qwen39-fix
on:
  push:
    branches:
      - feature/qwen38-27b-minefield-20260815
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python tools/tmp_qwen39_identity_fix.py
      - run: python -m minefield agent-bundle
      - run: python -m unittest tests.test_qwen38_leads tests.test_leads_catalog tests.test_leads_integration
      - run: python -m unittest integrity.tests.test_reference_mutations.ReferenceMutations.test_00_clean_tree_passes
      - shell: bash
        run: |
          set -euo pipefail
          git add leads/LEADS.json mining/2026-08-15-qwen38-27b-5090-spark.md tests/test_qwen38_leads.py minefield/data/UNVERIFIED_LEADS.json dist skills/model-serving-minefield/references/agent-bundle.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify complete container config for L045'
          git push origin HEAD:feature/qwen38-27b-minefield-20260815
