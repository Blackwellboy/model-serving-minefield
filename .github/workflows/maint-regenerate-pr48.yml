name: maint-regenerate-pr48

on:
  push:
    branches:
      - maint/tonyd2wild-batch-20260817

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Regenerate committed Minefield artefacts
        run: python -m minefield agent-bundle
      - name: Commit deterministic generated artefacts if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            dist
            minefield/data
            registry/diagnostic_coverage.json
            registry/guided_experiments.json
            web/registry-data.js
            skills/model-serving-minefield/references/agent-bundle.md
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "Generated artefacts already current."
            exit 0
          fi
          git add -- "${paths[@]}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Minefield agent artefacts"
          git push origin HEAD:maint/tonyd2wild-batch-20260817
