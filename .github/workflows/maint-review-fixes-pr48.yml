name: maint-review-fixes-pr48

on:
  push:
    branches:
      - maint/tonyd2wild-batch-20260817

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: maint/tonyd2wild-batch-20260817
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: apply editorial review fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {n}")
              p.write_text(s.replace(old, new))

          # 122 is a source-level hypothesis whose replication was never run.
          # CONTRIBUTING reserves `under test` for a replication actually running,
          # so retain the work as a mining lead instead of a numbered trap.
          src = Path('traps/quantization/122-prepack-format-detected-by-tensor-name.md')
          dst = Path('mining/2026-08-17-tonyd2wild-prepack-name-format-collision.md')
          if not src.exists():
              raise SystemExit('expected trap 122 source is missing')
          if dst.exists():
              raise SystemExit('destination mining lead already exists')
          s = src.read_text()
          s = s.replace(
              '# Trap 122: an expert prepack picks its decoder from tensor names, not dtype',
              '# Candidate: an expert prepack picks its decoder from tensor names, not dtype',
              1,
          )
          old_status = '''**Status: under test.** The format-selection mechanism is directly readable in
          public source at `Sapid-Labs/vLLM-Moet`, commit
          `2f1056c56a56e08c560c4b2109a4d298d94f2c6b`, `spark/prepack_planes.py`.
          The contributor also inspected an FP8 checkpoint whose expert names match the
          MXFP4 pattern, but the exact public checkpoint revision is not pinned in this
          entry and the mismatched pack was deliberately not run. The predicted
          corrupted-output half is therefore **not** claimed as observed; CONFIRM/REFUTE
          criteria are pre-registered below.
          '''
          new_status = '''**Disposition: public source lead; not a canonical trap.** The format-selection
          mechanism is directly readable in public source at `Sapid-Labs/vLLM-Moet`,
          commit `2f1056c56a56e08c560c4b2109a4d298d94f2c6b`,
          `spark/prepack_planes.py`. The contributor also inspected an FP8 checkpoint
          whose expert names match the MXFP4 pattern, but the exact public checkpoint
          revision is not pinned and the mismatched pack was deliberately not run.
          No replication is actually running, so the repository's closed status
          vocabulary does not permit this to be labelled `under test`. The predicted
          corrupted-output half is **not** claimed as observed; CONFIRM/REFUTE criteria
          remain pre-registered below so the lead can be promoted cleanly if somebody
          runs it.
          '''
          if old_status not in s:
              raise SystemExit('trap 122 status block did not match expected text')
          s = s.replace(old_status, new_status, 1)
          s = s.replace('**Symptom (predicted).**', '**Predicted failure shape (not observed).**', 1)
          s = s.replace('remains under test.', 'remains unrun.', 1)
          s = s.replace(
              'which is why this remains\n`under test` instead of borrowing certainty from the source inspection.',
              'which is why this stays in the mining layer instead of borrowing certainty\nfrom the source inspection.',
              1,
          )
          dst.write_text(s)
          src.unlink()

          # Canonical count becomes 121; doctor coverage remains 19.
          replace_exact('README.md', 'All 122\nentries are too many to read', 'All 121\nentries are too many to read')
          replace_exact('README.md', 'directly below, all 122 entries', 'directly below, all 121 entries')
          replace_exact('README.md', 'for **19 of these 122 entries**', 'for **19 of these 121 entries**')
          replace_exact('README.md', 'the other 103', 'the other 102')
          replace_exact('README.md', 'All 122 entries. If you know', 'All 121 entries. If you know')
          replace_exact('README.md', "against 19 of this registry's 122 entries", "against 19 of this registry's 121 entries")
          row122 = '| A 2-bit expert prepack succeeds on a renamed checkpoint and the served model is degraded | Format detected from tensor names rather than dtype, so fp8 data can be routed through the mxfp4 decoder | [122](traps/quantization/122-prepack-format-detected-by-tensor-name.md) | under test |\n'
          replace_exact('README.md', row122, '')
          old121 = '| The launcher prints a container ID for every worker and the workers never start | JSON CLI args re-split by the remote shell in an SSH fanout; docker creates the container and leaves it in Created | [121](traps/runtime/121-ssh-fanout-mangles-json-args.md) | contributor-measured, conditions as reported |\n'
          new121 = '| The launcher prints container IDs but remote workers never become usable ranks | SSH fanout reparses structured argv; container creation is not readiness and Docker state alone does not identify the quoting fault | [121](traps/runtime/121-ssh-fanout-mangles-json-args.md) | contributor-measured, conditions as reported |\n'
          replace_exact('README.md', old121, new121)

          replace_exact('doctor/minefield_doctor.py', 'REGISTRY_TRAP_COUNT = 122', 'REGISTRY_TRAP_COUNT = 121')
          replace_exact('minefield/data/minefield_doctor.py', 'REGISTRY_TRAP_COUNT = 122', 'REGISTRY_TRAP_COUNT = 121')
          replace_exact('doctor/README.md', "**19 of the registry's 122 numbered entries**", "**19 of the registry's 121 numbered entries**")
          replace_exact('doctor/README.md', 'implemented 19/122 | executed on this stack N | clean N | problems N | inconclusive N | not implemented 103', 'implemented 19/121 | executed on this stack N | clean N | problems N | inconclusive N | not implemented 102')
          replace_exact('doctor/README.md', 'remaining **103** numbered traps', 'remaining **102** numbered traps')
          replace_exact('playbooks/README.md', "19 of this registry's 122 numbered entries", "19 of this registry's 121 numbered entries")
          replace_exact('mining/OPEN_QUESTIONS.md', '**19 of 122** entries', '**19 of 121** entries')
          replace_exact('mining/OPEN_QUESTIONS.md', '103 uncovered entries', '102 uncovered entries')

          # Remove the non-canonical candidate from the model index.
          row_model_122 = '| DeepSeek-V4-Flash (DSpark fp8 repack, 2-bit Moet prepack source) | [122](../traps/quantization/122-prepack-format-detected-by-tensor-name.md) *(under test)* |\n'
          replace_exact('models/README.md', row_model_122, '')

          # Changelog: five canonical entries plus one retained mining lead.
          replace_exact('CHANGELOG.md', '### Multi-node serving traps from a 4x DGX Spark GB10 fleet (117-122)', '### Multi-node serving traps from a 4x DGX Spark GB10 fleet (117-121)')
          replace_exact(
              'CHANGELOG.md',
              'aarch64) nodes over RoCE serving GLM-5.2. Six new entries, five\ncontributor-measured and one filed under test:',
              'aarch64) nodes over RoCE serving GLM-5.2. Five new canonical entries, all\ncontributor-measured. One additional source-level candidate is retained in\n`mining/` rather than counted because no replication is actually running:',
          )
          replace_exact(
              'CHANGELOG.md',
              '- [121](traps/runtime/121-ssh-fanout-mangles-json-args.md) JSON CLI arguments\n  re-split by the remote shell in an SSH fanout leave workers in `Created`\n  while the launcher reports success\n',
              '- [121](traps/runtime/121-ssh-fanout-mangles-json-args.md) structured argv\n  is re-parsed by a remote shell in an SSH fanout; container IDs are not worker\n  readiness, and Docker state alone is not used to diagnose the quoting fault\n',
          )
          replace_exact(
              'CHANGELOG.md',
              '- [122](traps/quantization/122-prepack-format-detected-by-tensor-name.md)\n  **under test**: a 2-bit expert prepack selects its decoder from tensor names\n  rather than dtype, so a renamed fp8 checkpoint can be routed through the\n  mxfp4 path. Mechanism read from public source; corrupted output not observed,\n  CONFIRM/REFUTE criteria recorded in the entry\n',
              '- [prepack name/format collision candidate](mining/2026-08-17-tonyd2wild-prepack-name-format-collision.md):\n  source inspection shows a decoder-selection path driven by tensor names rather\n  than dtype/metadata. The suspect conversion was not run, so this remains a\n  mining lead with pre-registered CONFIRM/REFUTE criteria rather than a numbered trap\n',
          )

          # Credit the contributor on the registry's canonical credit surface.
          hof = Path('HALL_OF_FAME.md')
          hs = hof.read_text()
          if '@tonyd2wild' in hs:
              raise SystemExit('HALL_OF_FAME already contains @tonyd2wild unexpectedly')
          marker = '| **Blackwellboy** ([laguna-s21-lab](https://github.com/Blackwellboy/laguna-s21-lab)) | The lab whose measured runs seeded the registry | throughout |\n'
          if hs.count(marker) != 1:
              raise SystemExit('HALL_OF_FAME insertion marker missing or ambiguous')
          row = '| **@tonyd2wild** | Five contributor-measured multi-node serving findings from a 4x DGX Spark GB10 fleet: silent `fuse_gemm_comms` disable/unsafe force, hidden Ray worker progress, unified-memory free-memory drift, speculative block-table overhang, and SSH fanout argv reparsing | [117](traps/runtime/117-fuse-gemm-comms-accepted-then-disabled.md), [118](traps/runtime/118-ray-log-monitor-off-hides-worker-progress.md), [119](traps/memory/119-free-memory-drifts-down-after-churn.md), [120](traps/runtime/120-indexer-block-table-omits-spec-overhang.md), [121](traps/runtime/121-ssh-fanout-mangles-json-args.md) |\n'
          hof.write_text(hs.replace(marker, row + marker, 1))
          PY

          # Generated surfaces must be derived from the edited canonical tree.
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify

          # Local gates that do not need private sanitizer data or peer repos.
          python3 integrity/registry_integrity.py --github
          python3 integrity/reference_integrity.py --github
          python3 integrity/upstream_integrity.py --github
          python3 -m unittest discover -s integrity/tests -t integrity/tests
          python3 -m unittest discover -s doctor/tests -t doctor/tests
          python3 -m compileall -q minefield tests
          python3 -m unittest discover -s tests
          for f in checks/tests/test_*.py; do python3 "$f"; done
          python3 integrity/verify_surfaces.py --github --peer-mode defer

          # Fail if the demoted numbered path remains referenced outside generated history.
          if git grep -n '122-prepack-format-detected-by-tensor-name' -- README.md CHANGELOG.md doctor minefield/data/minefield_doctor.py mining models playbooks HALL_OF_FAME.md traps; then
            echo 'stale canonical 122 reference remains' >&2
            exit 1
          fi

          git status --short
          git add -A -- CHANGELOG.md README.md HALL_OF_FAME.md doctor minefield/data mining models playbooks traps dist registry web skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo 'No review-fix changes produced.' >&2
            exit 1
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve maintainer review findings"
          git push origin HEAD:maint/tonyd2wild-batch-20260817
