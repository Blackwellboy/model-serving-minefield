name: maint-regenerate-pr48-final

on:
  push:
    branches:
      - maint/tonyd2wild-batch-20260817

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: maint/tonyd2wild-batch-20260817
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: regenerate and commit if needed
        run: |
          set -euo pipefail
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
          git add -- dist minefield/data registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo "Generated surfaces already current."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate final agent surfaces"
          git push origin HEAD:maint/tonyd2wild-batch-20260817
