name: one-shot-scottleimroth-pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'maint/scottleimroth-intake-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Apply maintainer integration
        run: python3 .github/scripts/integrate_scottleimroth.py
      - name: Regenerate official derived surfaces
        run: python3 -m minefield agent-bundle
      - name: Commit generated tree and remove temporary helpers
        run: |
          rm -f .github/workflows/oneshot-scottleimroth-intake.yml
          rm -f .github/workflows/oneshot-scottleimroth-pr.yml
          rm -f .github/scripts/integrate_scottleimroth.py
          rm -f .oneshot-scottleimroth-trigger
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Integrate scottleimroth DGX Spark and Ling findings" || exit 0
          git push origin HEAD:maint/scottleimroth-intake-20260824
