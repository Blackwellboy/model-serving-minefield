name: tmp-maint-adjudicate-20260825

on:
  push:
    branches:
      - maint/adjudicate-seth-q16-q17-20260825
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Repair one-shot helper for PR61 Hall-of-Fame replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/maint_adjudicate_20260825.py')
          s = p.read_text()
          s = s.replace(
              'if not tony_pattern.search(h):\n    raise SystemExit("tonyd2wild Hall-of-Fame row not found")\n',
              ''
          )
          s = s.replace(
              'h = tony_pattern.sub(tony_row, h, count=1)\nwrite(hof_path, h)',
              '''if tony_pattern.search(h):\n    h = tony_pattern.sub(tony_row, h, count=1)\nelse:\n    marker = "| **Blackwellboy**"\n    idx = h.find(marker)\n    if idx < 0:\n        raise SystemExit("Blackwellboy Hall-of-Fame insertion point not found")\n    h = h[:idx] + tony_row + "\\n" + h[idx:]\nwrite(hof_path, h)'''
          )
          p.write_text(s)
          PY

      - name: Apply maintainer adjudication
        run: python3 tools/maint_adjudicate_20260825.py

      - name: Apply post-adjudication integrity fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The Q17 draft referenced a provisional/nonexistent Trap 80 slug.
          p = Path('traps/runtime/133-dspark-loader-drops-shared-expert.md')
          s = p.read_text()
          s = s.replace(
              '[80](../evaluation/80-parser-buffering-fakes-server-stalls.md)',
              '[80](80-reasoning-parser-batches-sse-deltas.md)'
          )
          p.write_text(s)

          # Registry integrity requires every new canonical file to be linked
          # or covered explicitly in CHANGELOG, not only named by bare number.
          p = Path('CHANGELOG.md')
          s = p.read_text()
          replacements = {
              '- **127** — @sethforprivacy:': '- [**127**](traps/versioning/127-bind-mount-shadow-drift-crash-loop.md) — @sethforprivacy:',
              '- **128** — @sethforprivacy:': '- [**128**](traps/runtime/128-admission-flag-never-read-decode-starvation.md) — @sethforprivacy:',
              '- **129** — @sethforprivacy:': '- [**129**](traps/memory/129-prefix-cache-hit-min-across-kv-groups.md) — @sethforprivacy:',
              '- **130** — @sethforprivacy:': '- [**130**](traps/runtime/130-cudagraph-clamp-runs-top-shape-eager.md) — @sethforprivacy:',
              '- **131** — @sethforprivacy:': '- [**131**](traps/versioning/131-hf-refs-file-breaks-offline-resolution.md) — @sethforprivacy:',
              '- **132** — @tonyd2wild,': '- [**132**](traps/runtime/132-cold-prefill-spec-placeholder-corrupts-prompt-tail.md) — @tonyd2wild,',
              '- **133** — @tonyd2wild:': '- [**133**](traps/runtime/133-dspark-loader-drops-shared-expert.md) — @tonyd2wild:',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing CHANGELOG marker: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Regenerate repository-owned surfaces
        run: |
          python3 -m minefield agent-bundle
          python3 -m minefield agent-bundle --verify

      - name: Validate source and generated tree
        run: |
          set -euxo pipefail
          git diff --check
          python3 integrity/registry_integrity.py
          python3 integrity/reference_integrity.py
          python3 integrity/upstream_integrity.py
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s doctor/tests -t doctor/tests
          python3 -m unittest discover -s integrity/tests -t integrity/tests
          for f in checks/tests/test_*.py; do python3 "$f"; done

      - name: Remove one-shot helper and workflow
        run: |
          rm -f tools/maint_adjudicate_20260825.py
          rm -f .github/workflows/tmp-maint-adjudicate-20260825.yml

      - name: Commit adjudicated result
        run: |
          git config user.name "blackwellboy-maint-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Adjudicate Seth PR61 and promote Q16/Q17"
          git push origin HEAD:maint/adjudicate-seth-q16-q17-20260825
