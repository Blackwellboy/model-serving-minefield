[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-serving-minefield"
version = "0.2.1"
description = "Read-only diagnostics for model-serving failures"
readme = "docs/PYPI_DESCRIPTION.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blackwellboy" }]
keywords = ["llm", "inference", "vllm", "llama.cpp", "sglang", "diagnostics", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/Blackwellboy/model-serving-minefield"
Issues = "https://github.com/Blackwellboy/model-serving-minefield/issues"
Changelog = "https://github.com/Blackwellboy/model-serving-minefield/blob/main/CHANGELOG.md"

[project.scripts]
minefield = "minefield.cli:main"
minefield-mcp = "minefield.mcp_server:main"

[tool.setuptools.packages.find]
include = ["minefield*"]

[tool.setuptools.package-data]
minefield = ["data/*.json", "data/*.py"]
