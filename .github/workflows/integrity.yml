name: integrity

# Runs the consistency layer on every push and PR. Four of the five checks
# live here. The fifth, the sanitizer whole-tree scan, deliberately does NOT:
# its pattern file is the list of internal names it scans for, so shipping it
# to a public runner would publish the thing it protects. That check runs from
# the private kit in the pre-push hook, and integrity/README.md says so in the
# same words, so nobody reads a green badge here as a sanitizer pass.
#
# The peer repo is checked out to RUNNER_TEMP, OUTSIDE the workspace. The first
# red run put it at .peer/ inside the workspace, so every peer file was scanned
# twice: once correctly under its own repo name, once under this repo's name,
# where its exemptions did not apply. A correctly exempt line was reported as a
# failure. The checkers now also prune nested checkouts on their own, so this
# layout choice is the belt and the pruning is the braces.
#
# Every check step runs even if an earlier one failed. The first red run
# skipped four checks after the first failure, so the badge said one thing was
# broken and nothing at all about the rest.

on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: check out the peer repo outside the workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Blackwellboy/laguna-s21-lab
          path: peer-laguna
          fetch-depth: 1
          persist-credentials: false
        continue-on-error: true

      # The Pages site is the third surface. It is a single index.html, not
      # markdown, which is why claim_propagation scans .html: without that it
      # would read the site's README and report a confident CLEAN. It is
      # checked out READ-ONLY and is never written to from here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Blackwellboy/Blackwellboy.github.io
          path: peer-bbio
          fetch-depth: 1
          persist-credentials: false
        continue-on-error: true

      - name: move the peer clones out of the workspace
        id: peer
        run: |
          mkdir -p "$RUNNER_TEMP/peer"
          if [ -d peer-laguna ]; then
            mv peer-laguna "$RUNNER_TEMP/peer/laguna-s21-lab"
            echo "path=$RUNNER_TEMP/peer/laguna-s21-lab" >> "$GITHUB_OUTPUT"
            echo "Peer repo at $RUNNER_TEMP/peer/laguna-s21-lab"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::peer repo unavailable; claim propagation will scan this repo only and will say so."
          fi
          if [ -d peer-bbio ]; then
            mv peer-bbio "$RUNNER_TEMP/peer/bbio"
            echo "bbio=$RUNNER_TEMP/peer/bbio" >> "$GITHUB_OUTPUT"
            echo "Pages site at $RUNNER_TEMP/peer/bbio"
          else
            echo "bbio=" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages site unavailable; the most public surface was NOT scanned this run."
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # The contradiction gate is not a separate step because it is not a
      # separate program: registry_integrity.py imports it and runs it over
      # every entry, so a second invocation would double-report. It IS
      # load-bearing (it is what stops an entry claiming "reproduced here"
      # while a file it ships says the raw is private), so it is named here
      # and named again in the verdict, rather than being a thing you only
      # find by reading the import list.
      - name: registry integrity (includes the contradiction gate)
        id: registry
        if: always()
        run: python3 integrity/registry_integrity.py --github

      # reference_integrity also carries the status-vocabulary checks:
      # VOCAB-DEFN, VOCAB-GATE, VOCAB-FULL and VOCAB-SLASH. The vocabulary is
      # defined in CONTRIBUTING and restated in README, MAINTAINING and the PR
      # template, and the PR template drifted to a three-label subset for
      # weeks without anything noticing.
      - name: reference integrity (includes the status vocabulary)
        id: refs
        if: always()
        run: python3 integrity/reference_integrity.py --github

      # OPEN_QUESTIONS claims to contain every unsettled question. Treat any
      # currently open issue whose title begins [trap] as unsettled intake until
      # it is either queued with preregistered CONFIRM/REFUTE criteria or closed.
      # GitHub's issues endpoint also returns PRs, so the checker excludes those.
      - name: open trap issue queue integrity
        id: openqueue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          rows = []
          for page in range(1, 101):
              url = f"https://api.github.com/repos/{repo}/issues?state=open&per_page=100&page={page}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              rows.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit("open issue pagination exceeded 100 pages")

          with open("/tmp/open-issues.json", "w", encoding="utf-8") as handle:
              json.dump(rows, handle)
          PY
          python3 integrity/open_issue_queue.py \
            --issues-json /tmp/open-issues.json \
            --repo "$GH_REPOSITORY" \
            --github

      # The fourth tier, upstream-reported, publishes material nobody here has
      # reproduced. The only thing that makes that safe is that every entry
      # names its primary source, its reporter and the issue state, says
      # plainly that we have not run it, and never reaches Core, the doctor or
      # a registry count. All of that is asserted here rather than observed.
      - name: upstream tier (the fourth tier's requirements)
        id: upstream
        if: always()
        run: python3 integrity/upstream_integrity.py --github

      - name: claim propagation
        id: claims
        if: always()
        run: |
          ARGS="--repo minefield=."
          if [ -n "${{ steps.peer.outputs.path }}" ]; then
            ARGS="$ARGS --repo laguna=${{ steps.peer.outputs.path }}"
          fi
          if [ -n "${{ steps.peer.outputs.bbio }}" ]; then
            ARGS="$ARGS --repo bbio=${{ steps.peer.outputs.bbio }}"
          fi
          python3 integrity/claim_propagation.py --github $ARGS

      - name: do-not-cite on added text
        id: dnc
        if: always()
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          python3 integrity/do_not_cite.py --github --base "$BASE"

      - name: mutation suite (the checks must have teeth)
        id: mutations
        if: always()
        env:
          MINEFIELD_PEER_REPO: ${{ steps.peer.outputs.path }}
        run: python3 -m unittest discover -s integrity/tests -t integrity/tests

      - name: doctor suite
        id: doctor
        if: always()
        run: python3 -m unittest discover -s doctor/tests -t doctor/tests

      # Every test_*.py in checks/tests, discovered rather than listed.
      #
      # This step used to name test_preflight_kwargs.py alone, so
      # test_check_contract.py, which is the guard against a check that cannot
      # fail, ran only in the local pre-push hook. That put a vacuous-check
      # regression behind somebody remembering to have the hook installed, and
      # the hook had already failed to fire once because a file was not
      # executable. Naming files here is what let one go missing, so this
      # loops instead: a new test file lands in CI the moment it lands in the
      # tree. The files are plain scripts that assert at import and print
      # their own verdict, which is why this is a loop and not a discover run.
      - name: checks suite
        id: checks
        if: always()
        run: |
          set -o pipefail
          found=0
          fail=0
          for f in checks/tests/test_*.py; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            echo "::group::$f"
            python3 "$f" || fail=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error title=checks::no test_*.py found under checks/tests."
            echo "Zero tests collected is not a pass; every universal claim is"
            echo "true of the empty set, which is the exact defect"
            echo "test_check_contract.py exists to catch."
            exit 1
          fi
          echo "ran $found check-suite script(s)"
          exit $fail

      # Local surfaces gate here. Peer surfaces are evaluated and printed with
      # a DEFERRED block naming the scheduled 'surfaces' workflow, which runs
      # the same job with --peer-mode gate.
      #
      # Peers cannot gate a push: the site rebuilds AFTER the push that moves
      # HEAD, so at push time it cannot have caught up. A missing peer still
      # fails, because absent is not stale.
      - name: public surfaces (local gate, peers deferred)
        id: surfaces
        if: always()
        run: |
          ARGS="--github --peer-mode defer"
          if [ -n "${{ steps.peer.outputs.bbio }}" ]; then
            ARGS="$ARGS --peer bbio=${{ steps.peer.outputs.bbio }}"
          fi
          python3 integrity/verify_surfaces.py $ARGS

      # Tell the Pages site that the registry moved, so it rebuilds in about a
      # minute instead of waiting for its own cron. The site workflow already
      # listens for repository_dispatch: [registry-updated] and nothing has
      # ever sent it, which is the whole reason the staleness window exists.
      #
      # This needs a PAT with repo scope on the SITE repo, as SITE_DISPATCH_TOKEN.
      # GITHUB_TOKEN is scoped to this repository only and cannot dispatch
      # across repos. Until that secret exists the step prints that it is
      # INACTIVE and names what covers the gap instead. It does not fail, and
      # it does not pretend to have fired: a dispatch step that silently
      # no-ops would be the same defect as a guard that never runs.
      - name: notify the Pages site that the registry moved
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH INACTIVE: SITE_DISPATCH_TOKEN is not set, so no"
            echo "registry-updated event was sent. The site will catch up on"
            echo "its own schedule instead, and the hourly 'surfaces' workflow"
            echo "is what reports the lag. To activate: add a PAT with repo"
            echo "scope on Blackwellboy.github.io as SITE_DISPATCH_TOKEN."
            exit 0
          fi
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Blackwellboy/Blackwellboy.github.io/dispatches \
            -d '{"event_type":"registry-updated"}')
          echo "dispatch HTTP $code"
          # 204 is success. Anything else is reported loudly but does not fail
          # the integrity run: the site catching up is not this repo's gate.
          if [ "$code" != "204" ]; then
            echo "::warning title=dispatch::registry-updated dispatch returned $code; site will fall back to its own schedule"
            cat /tmp/d.json || true
          fi

      - name: sanitizer status
        if: always()
        run: |
          echo "SANITIZER WHOLE-TREE SCAN: not run here, by design."
          echo "Its pattern file lists the internal names it scans for and"
          echo "cannot be published. It runs from the private kit via the"
          echo "pre-push hook: see integrity/README.md."

      # A single place that says what failed, so the badge is readable without
      # opening five collapsed step logs.
      - name: verdict
        if: always()
        run: |
          fail=0
          for pair in \
            "registry integrity + contradiction gate=${{ steps.registry.outcome }}" \
            "reference integrity + status vocabulary=${{ steps.refs.outcome }}" \
            "open trap issue queue=${{ steps.openqueue.outcome }}" \
            "upstream tier requirements=${{ steps.upstream.outcome }}" \
            "claim propagation=${{ steps.claims.outcome }}" \
            "do-not-cite=${{ steps.dnc.outcome }}" \
            "mutation suite=${{ steps.mutations.outcome }}" \
            "doctor suite=${{ steps.doctor.outcome }}" \
            "checks suite=${{ steps.checks.outcome }}" \
            "public surfaces, local=${{ steps.surfaces.outcome }}"; do
            name="${pair%%=*}"; outcome="${pair##*=}"
            if [ "$outcome" = "success" ]; then
              echo "PASS  $name"
            else
              echo "FAIL  $name ($outcome)"
              echo "::error title=integrity::$name failed. Its step log above names the file and the finding."
              fail=1
            fi
          done
          exit $fail
