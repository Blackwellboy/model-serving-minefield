name: regen-related-parser-pr128

on:
  push:
    branches: [fix/related-trap-array-index-parser-20260918]
    paths:
      - minefield/registry.py
      - tests/test_registry_generation_regressions.py
      - .github/workflows/regen-related-parser-pr128.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m minefield agent-bundle
      - name: Commit generated surfaces if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist minefield/data registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git commit -m "Regenerate registry after related-trap parser fix"
          git push
