[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msmf"
version = "0.1.0"
description = "Thin alias that depends on model-serving-minefield and exposes the same CLIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Blackwellboy" }]
keywords = ["minefield", "alias", "model-serving-minefield", "mcp", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "model-serving-minefield>=0.2,<0.3",
]

[project.urls]
Homepage = "https://github.com/Blackwellboy/model-serving-minefield"
Issues = "https://github.com/Blackwellboy/model-serving-minefield/issues"
Changelog = "https://github.com/Blackwellboy/model-serving-minefield/blob/main/CHANGELOG.md"

[project.scripts]
minefield = "minefield.cli:main"
minefield-mcp = "minefield.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["msmf*"]

