name: maint-trap122-integration

on:
  push:
    branches:
      - maint/integrate-trap122-cudagraph-20260818

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply maintainer adjudication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_slug = "122-mtp-turboquant-kv-corrupts-output.md"
          new_slug = "122-full-cuda-graph-corrupts-qwen38-mtp-verification.md"
          old_path = Path("traps/runtime") / old_slug
          new_path = Path("traps/runtime") / new_slug

          trap = '''# Trap 122: FULL CUDA-graph capture silently corrupts Qwen3.8 MTP verification on vLLM 0.27.1

**Found by ayayalar (A Y).**

**Status: contributor-measured, conditions as reported.** Measured by the
contributor on a single RTX 5090 with vLLM 0.27.1 and
`unsloth/Qwen3.8-27B-NVFP4`; not independently reproduced by the registry. The
failure and working controls were exercised repeatedly on the contributor's
lane. The working recipe and reusable benchmark harness are public in
[Qwen3.8-27B-NVFP4-TurboQuant](https://github.com/ayayalar/Qwen3.8-27B-NVFP4-TurboQuant).

**Symptom.** The server is fully ready, `/v1/models` responds, requests return
HTTP 200 with normal `finish_reason: stop`, and no serving error is logged, yet
MTP generations collapse into empty `content`, missing tool calls, failed needle
recall, or repetitive text such as `a a a ...` / `think think think ...`. The
failure was first isolated while using `turboquant_4bit_nc` KV, but a later
control reproduced the same collapse with `fp8` KV under the same FULL CUDA-graph
capture. That refutes the original hypothesis that 4-bit KV itself is the gate.

**Mechanism (root-caused on the contributor's lane).** On vLLM 0.27.1 at
capture-opt level >= 2, the default CUDA-graph mode is `FULL_AND_PIECEWISE`.
With a static MTP configuration, the affected speculative-verification path is
captured in FULL mode. On the contributor's measured path,
`TurboQuantAttentionImpl.forward()` performs a GPU-to-CPU synchronization via
`query_start_loc.tolist()` during spec verify; under FULL capture the attention
chunk is wrong, draft tokens are rejected on every step (`Accepted: 0`,
per-position acceptance `0.000`), and output collapses while transport still
looks healthy. Switching the same serving build to PIECEWISE graph capture
restores correct generation and non-zero draft acceptance.

The contributor also reproduced the output-collapse signature with `fp8` KV
under FULL capture. That is strong evidence that **graph mode, not 4-bit KV
dtype, is the discriminator on this lane**. It does not establish that every KV
dtype reaches the identical internal line on every vLLM build, so keep the
mechanism scoped to these measured conditions rather than generalising it to all
MTP or all CUDA-graph implementations.

**Stacks and builds bitten.** vLLM 0.27.1; single RTX 5090 (GB202/sm_120, 32
GiB; driver 610.43.02; CUDA 13.3); Python 3.13 environment with FlashInfer and
nvidia-cutlass-dsl; `unsloth/Qwen3.8-27B-NVFP4` (compressed-tensors mixed
NVFP4+fp8, Qwen3.5-family runtime architecture, native 262144-token context).
The original failing cell used `turboquant_4bit_nc` KV. A separate `fp8`-KV FULL
capture control showed the same corruption signature. Version, model, hardware,
and graph-mode scope matter.

**The check.** Do not diagnose this trap from MTP-on versus MTP-off alone; that
only proves that speculation changes the outcome. Run a three-arm control on the
same model, runtime build, KV dtype, request, sampling settings, and memory
configuration:

1. **FULL cell:** static MTP under the vLLM 0.27.1 default
   `FULL_AND_PIECEWISE` mode. Record graph-mode startup output and MTP acceptance
   counters.
2. **PIECEWISE cell:** keep MTP enabled but add dynamic speculative decoding,
   e.g. `"num_speculative_tokens_per_batch_size": [[1,4,3]]`, so vLLM steps
   FULL capture down to PIECEWISE. Confirm that downgrade in the startup log.
3. **No-spec control:** same launch with MTP disabled.

For each arm run at least: one short non-repetition prompt, one structured tool
call whose name and JSON arguments are checked, and one needle-recall prompt.
This trap is supported when the FULL cell corrupts while PIECEWISE and no-spec
controls are clean, with the graph-mode transition actually observed. If FULL
and PIECEWISE both fail, or the graph mode was not verified, the result is
inconclusive for Trap 122.

**The fix.** On this vLLM 0.27.1 lane, keep MTP but prevent FULL capture of the
affected verify path. The contributor's verified route is dynamic speculative
decoding (`"num_speculative_tokens_per_batch_size": [[1,4,3]]`), which makes
vLLM downgrade to PIECEWISE for reliability. `--enforce-eager` is a slower
fallback that also avoids FULL capture. Under the PIECEWISE route the
contributor reports full-window correctness on the same RTX 5090: tools 12/12,
needles 8K through 196K PASS, code-edit PASS, and about 148.5 tok/s
single-stream under the published default. Those are working-state measurements
for this exact recipe, not a general vLLM performance claim.

**Related boundaries.** [Trap 28](28-mtp-fails-only-under-concurrency-or-temperature.md)
owns speculative paths that look green in the single-stream/greedy cell and then
fail under concurrency, temperature, or layout. Trap 122 is deliberately
different: its broken cell is already single-stream and can be discriminated by
FULL versus PIECEWISE graph mode. [Trap 62](62-spec-decode-garble-under-wrong-drafter-config.md)
contains an older DeepSeek/DGX-Spark report that full CUDA graphs can wedge
speculative decode, but that report was not isolated there. Trap 122 is the
scoped contributor-measured Qwen3.8/vLLM 0.27.1 graph-mode A/B; it does not
retroactively upgrade Trap 62's older evidence.

**Found.** 2026-08-14; graph-mode discriminator/root-cause controls completed
2026-08-15/17 while validating the public Qwen3.8 RTX 5090 recipe.

**Attribution.** ayayalar (A Y): discovery, RTX 5090 hardware qualification,
FULL-versus-PIECEWISE controls, FP8-vs-4-bit discriminator, raw serving A/B, and
public reproduction recipe/benchmark harness. Minefield maintainer adjudication
only narrows the canonical title, confirmation check, and evidence boundary; it
does not claim Blackwellboy reproduced the contributor's hardware result.
'''

          if not old_path.exists():
              raise SystemExit(f"missing expected source: {old_path}")
          if new_path.exists():
              raise SystemExit(f"new path already exists unexpectedly: {new_path}")
          new_path.write_text(trap, encoding="utf-8")
          old_path.unlink()

          # README symptom row: name the actual discriminator, not the discovery KV dtype.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          old = "| Server fully up, HTTP 200, `finish_reason: stop`, every completion garbled (empty content, no tool calls, token repetition) with 4-bit turboquant KV + MTP on | FULL CUDA-graph capture corrupts the spec-verify path on a build where either works alone; single-stream temp-0 shows it (the cell trap 28 treats as safe) | [122](traps/runtime/122-mtp-turboquant-kv-corrupts-output.md) | contributor-measured, conditions as reported |"
          new = "| Server fully up, HTTP 200, normal finish reason, but Qwen3.8 MTP output collapses under FULL CUDA graphs | On the contributor's vLLM 0.27.1 RTX 5090 lane, FULL capture corrupts speculative verification; the same build is clean when MTP is kept on but graph mode is forced to PIECEWISE | [122](traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md) | contributor-measured, conditions as reported |"
          if old not in text:
              raise SystemExit("README Trap 122 row did not match expected source")
          p.write_text(text.replace(old, new), encoding="utf-8")

          # Changelog: preserve discovery history while correcting the canonical owner.
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          start = text.index("## 2026-08-17\n")
          end = text.index("## 2026-08-16\n")
          replacement = '''## 2026-08-17

### Trap 122: FULL CUDA-graph capture silently corrupts Qwen3.8 MTP verification on vLLM 0.27.1

Contributed by **ayayalar (A Y)**; measured on the contributor's single RTX
5090 with vLLM 0.27.1 and `unsloth/Qwen3.8-27B-NVFP4`. Status remains
**contributor-measured, conditions as reported**; the registry has not claimed
an independent reproduction.

- [122](traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md)
  records a silent HTTP-200 output collapse under FULL CUDA-graph capture of the
  MTP verification path. The finding was first exposed with
  `turboquant_4bit_nc` KV, but the contributor later reproduced the same FULL-
  graph collapse with `fp8` KV, refuting the original "4-bit KV is the gate"
  hypothesis.
- The discriminating control is now **FULL versus PIECEWISE**, not merely MTP-on
  versus MTP-off. Dynamic speculative decoding forces PIECEWISE on this build
  and restores correct output with MTP still active; the public working recipe
  reports tools 12/12, needles 8K-196K PASS and ~148.5 tok/s single-stream at
  its published default.
- Trap 62 remains the owner of its older DeepSeek/drafter-configuration evidence
  and unisolated full-graph report. Trap 122 is the scoped Qwen3.8/vLLM 0.27.1
  graph-mode A/B and does not retroactively strengthen Trap 62's evidence.
- Registry count remains 122 after the renumber from the contributor's original
  provisional ID 117; doctor coverage remains 19, leaving 103 canonical entries
  unimplemented.

'''
          p.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          # Model index: correct link and make the canonical finding visible from the main Qwen row.
          p = Path("models/README.md")
          text = p.read_text(encoding="utf-8").replace(old_slug, new_slug)
          marker = "| Qwen 3.8 27B ([full page](qwen3.8-27b.md)): Q4_K_M on RTX 5090; BF16/FP8/NVFP4 on DGX Spark; aeon-vLLM, llama.cpp and experimental vLLM coverage | Public L-series campaign leads [L043–L048](qwen3.8-27b.md#qwen38-27b-troubleshooting-leads) cover runtime-specific MTP support, amd64 benchmark images on arm64 Spark, post-save/load Docker identity, container ENTRYPOINT argv mismatches, soak-thread teardown crashes, and a one-off decimal canary that did not immediately reproduce; also check generic traps [09](../traps/runtime/09-image-choice-changes-outcome.md), [10](../traps/quantization/10-quant-label-is-not-the-kernel-path.md), [52](../traps/evaluation/52-speed-measured-on-a-broken-config.md), [112](../traps/runtime/112-process-liveness-is-not-model-readiness.md) |"
          replacement_row = "| Qwen 3.8 27B ([full page](qwen3.8-27b.md)): Q4_K_M on RTX 5090; BF16/FP8/NVFP4 on DGX Spark; aeon-vLLM, llama.cpp and experimental vLLM coverage | Canonical contributor finding [122](../traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md) covers the scoped vLLM 0.27.1 / RTX 5090 FULL-vs-PIECEWISE MTP graph-mode failure. Public L-series campaign leads [L043–L048](qwen3.8-27b.md#qwen38-27b-troubleshooting-leads) cover the weaker/unpromoted campaign lessons; also check generic traps [09](../traps/runtime/09-image-choice-changes-outcome.md), [10](../traps/quantization/10-quant-label-is-not-the-kernel-path.md), [52](../traps/evaluation/52-speed-measured-on-a-broken-config.md), [112](../traps/runtime/112-process-liveness-is-not-model-readiness.md) |"
          if marker not in text:
              raise SystemExit("models/README Qwen3.8 summary row did not match")
          p.write_text(text.replace(marker, replacement_row), encoding="utf-8")

          # Full Qwen model page: distinguish first-party campaign work from the external canonical contribution.
          p = Path("models/qwen3.8-27b.md")
          text = p.read_text(encoding="utf-8")
          insert_before = "## A useful non-result: vision\n"
          section = '''## Canonical RTX 5090 MTP/CUDA-graph trap (contributor-measured)

A separate public contribution from **ayayalar (A Y)** adds canonical
[Trap 122](../traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md)
for `unsloth/Qwen3.8-27B-NVFP4` on one RTX 5090 with vLLM 0.27.1. This is not a
Blackwellboy reproduction and should retain its published status:
**contributor-measured, conditions as reported**.

The important discriminator is graph mode. Static MTP under FULL capture silently
collapsed output while keeping HTTP 200 / normal finish reasons; keeping MTP on
but forcing PIECEWISE via dynamic speculative decoding restored correct output.
The contributor also reproduced the FULL-graph collapse with fp8 KV, so the
canonical owner is the graph-mode/spec-verify interaction, not "4-bit KV is
broken". Use the three-arm FULL / PIECEWISE / no-spec check in Trap 122 before
attributing a similar symptom to this mechanism.

'''
          if insert_before not in text:
              raise SystemExit("qwen model page insertion marker missing")
          if "Canonical RTX 5090 MTP/CUDA-graph trap" not in text:
              text = text.replace(insert_before, section + insert_before)
          p.write_text(text, encoding="utf-8")

          # vLLM stack page: keep Trap 62 and Trap 122 separate by evidence/mechanism boundary.
          p = Path("stacks/vllm.md")
          text = p.read_text(encoding="utf-8")
          needle = "- [62](../traps/runtime/62-spec-decode-garble-under-wrong-drafter-config.md):\n  a speculative-decode drafter configuration that garbles the markup dialect,\n  with the known-good configuration published as a table.\n"
          add = needle + "- [122](../traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md):\n  on one contributor-measured Qwen3.8 / vLLM 0.27.1 RTX 5090 lane, FULL\n  CUDA-graph capture silently corrupts MTP verification while PIECEWISE is\n  clean; verify graph mode explicitly before blaming the KV dtype.\n"
          if needle not in text:
              raise SystemExit("vLLM trap 62 bullet marker missing")
          p.write_text(text.replace(needle, add), encoding="utf-8")

          # Trap 62: add the bounded cross-reference that PR #35's body claimed but did not actually contain.
          p = Path("traps/runtime/62-spec-decode-garble-under-wrong-drafter-config.md")
          text = p.read_text(encoding="utf-8")
          cross = '''

## Added 2026-08-18: bounded Qwen3.8 FULL-graph cross-reference

[Trap 122](122-full-cuda-graph-corrupts-qwen38-mtp-verification.md) now carries a
separate **contributor-measured, conditions as reported** Qwen3.8 / RTX 5090 /
vLLM 0.27.1 A/B in which FULL CUDA-graph capture corrupts MTP verification and
PIECEWISE restores correct output with MTP still enabled. That is stronger and
narrower evidence than the Keys addendum above, but it does **not** retroactively
upgrade this entry's DeepSeek/DGX-Spark report or establish that the mechanisms
are identical. Trap 62 remains about its documented drafter/configuration lane;
Trap 122 owns the isolated Qwen3.8 graph-mode discriminator.
'''
          if "bounded Qwen3.8 FULL-graph cross-reference" not in text:
              text = text.rstrip() + cross + "\n"
          p.write_text(text, encoding="utf-8")

          # Trap 28: make the non-duplicate boundary explicit.
          p = Path("traps/runtime/28-mtp-fails-only-under-concurrency-or-temperature.md")
          text = p.read_text(encoding="utf-8")
          tail = "[trap 14](../versioning/14-finetune-reupload-not-drop-in.md) (drafter\nartifacts differ across re-uploads)."
          expanded = tail + "\n[trap 122](122-full-cuda-graph-corrupts-qwen38-mtp-verification.md) is a distinct\nsingle-stream Qwen3.8/vLLM 0.27.1 failure: its discriminator is FULL versus\nPIECEWISE CUDA-graph mode, not concurrency, temperature, or parallel layout."
          if tail not in text:
              raise SystemExit("trap 28 related-tail marker missing")
          p.write_text(text.replace(tail, expanded), encoding="utf-8")

          # Hall of Fame: contributor-measured canonical work gets explicit credit.
          p = Path("HALL_OF_FAME.md")
          text = p.read_text(encoding="utf-8")
          anchor = "| **@tonyd2wild** | Five contributor-measured multi-node serving findings"
          row = "| **@ayayalar** ([Qwen3.8-27B-NVFP4-TurboQuant](https://github.com/ayayalar/Qwen3.8-27B-NVFP4-TurboQuant)) | Isolated a silent Qwen3.8 MTP output collapse on RTX 5090 to FULL CUDA-graph capture on vLLM 0.27.1, then falsified the original 4-bit-KV hypothesis with an fp8 control and published the working PIECEWISE recipe plus reusable benchmark harness | [122](traps/runtime/122-full-cuda-graph-corrupts-qwen38-mtp-verification.md) |\n"
          if anchor not in text:
              raise SystemExit("Hall of Fame Tony anchor missing")
          if "**@ayayalar**" not in text:
              text = text.replace(anchor, row + anchor)
          p.write_text(text, encoding="utf-8")

          # Manual source links should no longer use the provisional slug.
          manual = [
              Path("README.md"), Path("CHANGELOG.md"), Path("models/README.md"),
              Path("models/qwen3.8-27b.md"), Path("stacks/vllm.md"),
              Path("HALL_OF_FAME.md"),
          ]
          for path in manual:
              if old_slug in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"stale old Trap 122 slug remains in {path}")
          PY

      - name: Regenerate deterministic surfaces
        run: python -m minefield agent-bundle

      - name: Focused validation
        shell: bash
        run: |
          python integrity/registry_integrity.py
          python integrity/reference_integrity.py
          python integrity/upstream_integrity.py
          python -m minefield agent-bundle --verify
          python -m unittest discover -s tests
          python -m unittest discover -s integrity/tests -t integrity/tests
          if grep -R --exclude-dir=.git -n '122-mtp-turboquant-kv-corrupts-output.md' .; then
            echo 'stale provisional Trap 122 slug remains' >&2
            exit 1
          fi

      - name: Commit final maintainer integration and remove helper
        shell: bash
        run: |
          rm .github/workflows/zz-maint-trap122-integrate.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Adjudicate Trap 122 as CUDA-graph MTP verification failure'
          git push origin HEAD:${GITHUB_REF_NAME}
