name: offline-readiness-build-once
on:
  push:
    branches: [feature/doctor-offline-readiness-20261013]
    paths: [.github/workflows/readiness-once.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Blackwellboy/model-serving-minefield'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feature/doctor-offline-readiness-20261013
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Apply source-only patches and rebuild deterministic distribution
        run: |
          git apply --check --unidiff-zero .github/readiness-core.patch .github/readiness-options.patch .github/readiness-docs.patch
          git apply --unidiff-zero .github/readiness-core.patch .github/readiness-options.patch .github/readiness-docs.patch
          python -m pip install 'jinja2>=3.1'
          python -m compileall -q minefield doctor tests
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
      - name: Offline and loopback fixture tests only
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s doctor/tests -t doctor/tests
          python -m unittest discover -s community/tests -t .
      - name: Commit validated source and regenerated surfaces
        run: |
          git add CHANGELOG.md docs/CLI_REFERENCE.md docs/LIBRARY_API.md docs/LIVE_MODEL_QUALIFICATION.md doctor/README.md doctor/minefield_doctor.py minefield/api.py minefield/cli.py minefield/mcp_server.py minefield/probe_options.py minefield/unified.py dist/ minefield/data/ registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          git rm .github/readiness-core.patch .github/readiness-options.patch .github/readiness-docs.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: exact Doctor plans, operator inputs and execution receipts'
          git push origin HEAD:feature/doctor-offline-readiness-20261013
      - name: Preserve failed worktree for diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-readiness-build-${{ github.run_id }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
