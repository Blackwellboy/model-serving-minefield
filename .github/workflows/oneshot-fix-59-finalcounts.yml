name: one-shot-fix-59-finalcounts

on:
  push:
    branches: [maint/scottleimroth-intake-20260824]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/scottleimroth-intake-20260824
          fetch-depth: 0
      - name: Fix enforced registry totals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reps = {
              'README.md': [
                  ('All 124\nentries are too many to read', 'All 126\nentries are too many to read'),
                  ('all 124 entries, one row each', 'all 126 entries, one row each'),
              ],
              'doctor/README.md': [
                  ("19 of the registry's 124 numbered entries", "19 of the registry's 126 numbered entries"),
                  ('implemented 19/124', 'implemented 19/126'),
                  ('not implemented 105', 'not implemented 107'),
                  ('remaining **105** numbered traps', 'remaining **107** numbered traps'),
              ],
              'playbooks/README.md': [
                  ("19 of this registry's 124 numbered entries", "19 of this registry's 126 numbered entries"),
              ],
              'mining/OPEN_QUESTIONS.md': [
                  ('**19 of 124** entries', '**19 of 126** entries'),
                  ('105 uncovered entries', '107 uncovered entries'),
              ],
          }
          for rel, pairs in reps.items():
              p = Path(rel)
              s = p.read_text()
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          rm -f .registry-debug-59.txt
      - name: Regenerate repository-owned derived surfaces
        run: python3 -m minefield agent-bundle
      - name: Prove registry integrity locally
        run: python3 integrity/registry_integrity.py --root .
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/oneshot-fix-59-finalcounts.yml
          git config user.name "Blackwellboy-maintainer-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git commit -m "Fix final registry count surfaces for traps 125-126"
          git push origin HEAD:maint/scottleimroth-intake-20260824
