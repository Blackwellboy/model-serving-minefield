name: release-artifacts

# Runs only on a pushed version tag (v0.2.1, ...). Nothing here runs on a
# branch push or a pull request, so merging this file publishes nothing.
#
# PyPI publishing uses trusted publishing (OIDC): no API token is stored in
# this repository. Before the first tag the maintainer must, once:
#   1. on PyPI, add a trusted publisher for project model-serving-minefield:
#      owner Blackwellboy, repository model-serving-minefield,
#      workflow release.yml, environment pypi;
#   2. on GitHub, create the environment "pypi" (Settings > Environments) and
#      give it a required reviewer, so every upload waits for a click.
# Until step 1 is done the publish job fails at the token exchange and
# uploads nothing.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: tag must match the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - name: verify, test, build
        run: |
          python -m pip install "jinja2>=3.1"
          python -m minefield agent-bundle --verify
          python -m unittest discover -s tests
          python -m pip install build==1.4.0 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: installed wheel works outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wheel-env/bin:$PATH"
          # The registry, leads and doctor copy must load from package data,
          # not from a repository that an installed user does not have.
          python -c 'import minefield, minefield.registry as r, minefield.doctor_adapter as d; assert "site-packages" in minefield.__file__, minefield.__file__; assert r.load_registry()["entries"]; from pathlib import Path; assert (Path(minefield.__file__).parent / "data" / "minefield_doctor.py").is_file()'
          minefield coverage --json
          minefield streaming shows blank replies > /dev/null
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' | minefield-mcp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MINEFIELD_AGENT_BUNDLE.md
            dist/MINEFIELD_AGENT_BUNDLE_LITE.md
            dist/MINEFIELD_AGENT_BUNDLE.json
            dist/MINEFIELD_REGISTRY.json
            dist/MINEFIELD_REGISTRY.min.json
            dist/model-serving-minefield-agent-pack.zip
            dist/MANIFEST.txt
            dist/SHA256SUMS
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/model-serving-minefield/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
