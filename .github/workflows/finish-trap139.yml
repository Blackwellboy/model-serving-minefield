name: finish-trap139

on:
  push:
    branches:
      - integration/trap139-switchless-nccl-alex

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: integration/trap139-switchless-nccl-alex
          persist-credentials: true
      - name: setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: patch canonical registry surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          trap_path='traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md'

          p=Path('README.md'); t=p.read_text(encoding='utf-8')
          for old,new in [
              ('All 138\nentries are too many to read','All 139\nentries are too many to read'),
              ('all 138 entries','all 139 entries'),
              ('All 138 entries','All 139 entries'),
              ('for **19 of these 138 entries**','for **19 of these 139 entries**'),
              ('about the other 119','about the other 120'),
              ("19 of this registry's 138 entries","19 of this registry's 139 entries"),
          ]:
              t=t.replace(old,new)
          if trap_path not in t:
              lines=t.splitlines()
              marker='traps/evaluation/138-ngram-prompt-lookup-duplicates-structured-output-tokens.md'
              idx=next(i for i,line in enumerate(lines) if marker in line and line.startswith('|'))
              lines.insert(idx+1,'| A direct-cable multi-NIC collective times out even though the peer link is healthy | NCCL selected an interface that cannot physically reach that peer on the switchless topology | [139](traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md) | contributor-measured, conditions as reported |')
              t='\n'.join(lines)+'\n'
          p.write_text(t,encoding='utf-8')

          changes={
            'playbooks/README.md':[("19 of this registry's 138 numbered entries","19 of this registry's 139 numbered entries")],
            'doctor/README.md':[
                ("19 of the registry's 138 numbered entries","19 of the registry's 139 numbered entries"),
                ('implemented 19/138','implemented 19/139'),
                ('not implemented 119','not implemented 120'),
                ('remaining **119** numbered traps','remaining **120** numbered traps'),
            ],
            'doctor/minefield_doctor.py':[('REGISTRY_TRAP_COUNT = 138','REGISTRY_TRAP_COUNT = 139')],
            'minefield/data/minefield_doctor.py':[('REGISTRY_TRAP_COUNT = 138','REGISTRY_TRAP_COUNT = 139')],
          }
          for name,pairs in changes.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f'MISSING {name}: {old}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')

          p=Path('models/README.md'); t=p.read_text(encoding='utf-8')
          link='[139](../traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md)'
          if link not in t:
              old='| Multi-host NCCL / RoCE / RDMA bring-up (GID tables, fabric env) | [114](../traps/runtime/114-hardcoded-rdma-gid-index-is-not-portable.md) |'
              new='| Multi-host NCCL / RoCE / RDMA bring-up (GID tables, fabric env) | [114](../traps/runtime/114-hardcoded-rdma-gid-index-is-not-portable.md), '+link+' |'
              if old not in t: raise SystemExit('MISSING NCCL stack row')
              t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')

          p=Path('HALL_OF_FAME.md'); t=p.read_text(encoding='utf-8')
          if '**@btcxoomer**' not in t.lower():
              rows=(
                '| **@btcxoomer** | Isolated the 3-node DGX Spark switchless NCCL peer/HCA selection failure and reproduced it below the serving engine with a minimal collective | [139](traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md) |\n'
                '| **Alex Ellis (@alexellisuk)** ([switchless-nccl](https://github.com/alexellis/switchless-nccl)) | Published the independently source-pinned four-node switchless NCCL implementation, provenance, runtime hardening and qualification evidence used to bound and corroborate Trap 139; his repository preserves its own upstream credits | [139](traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md) |\n'
              )
              marker='| **Blackwellboy** ([laguna-s21-lab]'
              idx=t.find(marker)
              if idx < 0: raise SystemExit('MISSING HOF insertion marker')
              t=t[:idx]+rows+t[idx:]
          p.write_text(t,encoding='utf-8')

          p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8')
          if trap_path not in t:
              block='''## 2026-09-14 - Trap 139 switchless NCCL peer/device selection\n\n- [**139**](traps/runtime/139-stock-nccl-round-robins-hcas-to-the-ring-successor.md) - @btcxoomer: on the reported 3-node DGX Spark switchless lane, NCCL selected an interface that could not physically reach the intended peer; the same failure reproduced in the serving bring-up and a minimal collective. Status **contributor-measured, conditions as reported**.\n- Independent public implementation and four-node qualification evidence is credited to **Alex Ellis (@alexellisuk), OpenFaaS Ltd**, via `alexellis/switchless-nccl`. The entry keeps Alex's four-node evidence separate from @btcxoomer's exact 3-node mechanism and preserves Alex's own upstream provenance.\n- Corrected the earlier draft's GID guidance: one numeric GID index is not a portable cross-host fix; Trap 114 remains the canonical portability warning.\n- Registry count moves from 138 to 139; Doctor coverage remains 19, leaving 120 canonical entries unimplemented.\n\n'''
              if not t.startswith('# Changelog\n\n'): raise SystemExit('BAD CHANGELOG HEADER')
              t='# Changelog\n\n'+block+t[len('# Changelog\n\n'):]
          p.write_text(t,encoding='utf-8')
          PY
      - name: regenerate canonical artefacts
        run: python -m minefield agent-bundle
      - name: verify integration locally
        run: |
          python integrity/registry_integrity.py
          python integrity/reference_integrity.py
          python integrity/upstream_integrity.py
          python -m unittest discover -s integrity/tests -t integrity/tests
          python -m unittest discover -s doctor/tests -t doctor/tests
          git diff --check
      - name: commit finished integration and remove helper
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-trap139.yml
          git add -- README.md CHANGELOG.md HALL_OF_FAME.md models/README.md playbooks/README.md doctor/README.md doctor/minefield_doctor.py minefield/data/minefield_doctor.py dist minefield/data registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          git config user.name 'blackwellboy-ci'
          git config user.email '76774064+Blackwellboy@users.noreply.github.com'
          git commit -m 'maint: complete Trap 139 registry integration'
          git push origin HEAD:integration/trap139-switchless-nccl-alex
