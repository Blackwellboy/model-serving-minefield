name: one-shot Scott corroboration regeneration

on:
  push:
    branches:
      - maintenance/scott-corroboration-sweep-20261007

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: regenerate deterministic public artifacts
        run: |
          python -m pip install "jinja2>=3.1"
          python -m minefield agent-bundle
      - name: remove this one-shot workflow and commit generated surfaces
        run: |
          rm .github/workflows/scott-corroboration-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: regenerate Scott corroboration surfaces"
            git push origin HEAD:maintenance/scott-corroboration-sweep-20261007
          fi
