name: finish-public-mining-removal

on:
  push:
    branches:
      - ops/remove-public-mining-20260830
    paths:
      - .github/workflows/finish-public-mining-removal.yml

permissions:
  contents: write

jobs:
  migrate-public-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/remove-public-mining-20260830
          fetch-depth: 0

      - name: Replace private mining dependencies with public-safe governance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # Public queue contains only public issue governance, never raw/private mining notes.
          queue = root / 'registry' / 'OPEN_TRAP_ISSUES.md'
          queue.write_text('''# Open trap issue governance\n\nThis is a **public governance surface only**. It does not contain raw evidence, unpublished mining notes, private source harvests, or private candidate packets. Those do not belong in this public repository.\n\nEvery currently open issue whose title begins `[trap]` must appear here with criteria written before adjudication. The integrity gate compares this file against live GitHub issue state.\n\nCoverage snapshot: the doctor implements checks for **19 of 135** entries.  116 uncovered entries remain outside automated doctor checks.\n\n## OPEN\n\n### Q71. SGLang answers a request naming a model it does not serve\n\n- **Public issue.** https://github.com/Blackwellboy/model-serving-minefield/issues/71\n- **CONFIRM.** On a serve whose resolved server state proves model A is loaded, send an OpenAI-compatible request naming a different model B that is not served. Confirm the server returns ordinary HTTP-200 assistant content rather than rejecting the model mismatch, while a control stack that validates model identity rejects the same mismatch.\n- **REFUTE.** The mismatched model request is rejected, or resolved server state shows the supposedly mismatched name is actually served.\n- **Boundary.** This queue records the public issue and its adjudication criteria only; raw reproduction artifacts are not stored here.\n\n### Q72. Omitted reasoning effort resolves to the most expensive setting on the reported SGLang path\n\n- **Public issue.** https://github.com/Blackwellboy/model-serving-minefield/issues/72\n- **CONFIRM.** On the same pinned lane, compare rendered/request accounting for omitted effort and the model's maximum effort setting, with at least one lower explicit effort control. Confirm omission matches the maximum while the explicit lower setting is measurably distinct, and separately verify any server-side default override if claimed.\n- **REFUTE.** Omission does not match the maximum setting under the pinned protocol, or the alleged client effort knob is genuinely inert across the controls.\n- **Boundary.** Generation wall time is supporting evidence, not the sole mechanism test; the public issue's deterministic prompt-token/rendering control is preferred.\n\n### Q73. Reload-to-reload score drift is removed by deterministic/autotune pinning on the reported stack\n\n- **Public issue.** https://github.com/Blackwellboy/model-serving-minefield/issues/73\n- **CONFIRM.** Reproduce reload-to-reload teacher-forced score movement under the reported stock launch, then repeat matched reloads with deterministic inference enabled and FlashInfer autotune disabled. Confirm per-item score movement collapses to zero (or the preregistered deterministic tolerance) without a material quality or throughput regression.\n- **REFUTE.** The stock reload drift cannot be reproduced under the pinned protocol, or the drift persists after deterministic/autotune pinning.\n- **Boundary.** A successful pin establishes this stack-specific remedy; it does not prove the same flags solve within-load nondeterminism on other engines/models.\n\n## Privacy rule\n\nRaw candidate research and unpublished evidence are not a public-repository surface. Public promotion starts from a deliberately scrubbed/adjudicated change, not by copying a private research directory into this repository.\n''', encoding='utf-8')

          # Repoint the issue-state integrity gate to the public-safe governance file.
          p = root / 'integrity' / 'open_issue_queue.py'
          t = p.read_text(encoding='utf-8')
          t = t.replace('Fail when an open [trap] issue is absent from mining/OPEN_QUESTIONS.md.',
                        'Fail when an open [trap] issue is absent from registry/OPEN_TRAP_ISSUES.md.')
          t = t.replace('DEFAULT_QUEUE = ROOT / "mining" / "OPEN_QUESTIONS.md"',
                        'DEFAULT_QUEUE = ROOT / "registry" / "OPEN_TRAP_ISSUES.md"')
          t = t.replace('mining/OPEN_QUESTIONS.md', 'registry/OPEN_TRAP_ISSUES.md')
          p.write_text(t, encoding='utf-8')

          # Keep the mutation tests load-bearing, but move the live governance fixture.
          p = root / 'integrity' / 'tests' / 'test_mutations.py'
          t = p.read_text(encoding='utf-8')
          t = t.replace('doctor-coverage prose in mining/OPEN_QUESTIONS.md',
                        'doctor-coverage prose in registry/OPEN_TRAP_ISSUES.md')
          t = t.replace('return os.path.join(self.root, "mining", "OPEN_QUESTIONS.md")',
                        'return os.path.join(self.root, "registry", "OPEN_TRAP_ISSUES.md")')
          p.write_text(t, encoding='utf-8')

          # Reference-integrity mutation should exercise a public canonical link, not a deleted private note.
          p = root / 'integrity' / 'tests' / 'test_reference_mutations.py'
          t = p.read_text(encoding='utf-8')
          old = '''    def test_19_mining_note_citing_a_dead_id(self):\n        p = os.path.join(self.repo, "mining", "OPEN_QUESTIONS.md")\n        t = open(p, encoding="utf-8").read()\n        t = t.replace("../traps/runtime/97-", "../traps/runtime/970-", 1)\n        open(p, "w", encoding="utf-8").write(t)\n        rc, out = run_checker(self.repo)\n        self.assertEqual(rc, 1, out)\n        self.assertIn("REF-EXISTS", out)\n'''
          new = '''    def test_19_public_surface_citing_a_dead_id(self):\n        p = os.path.join(self.repo, "README.md")\n        t = open(p, encoding="utf-8").read()\n        needle = "traps/runtime/60-cold-prefill-and-cache-hit-disagree.md"\n        self.assertIn(needle, t, "fixture drift: canonical trap 60 README link missing")\n        t = t.replace(needle, "traps/runtime/600-cold-prefill-and-cache-hit-disagree.md", 1)\n        open(p, "w", encoding="utf-8").write(t)\n        rc, out = run_checker(self.repo)\n        self.assertEqual(rc, 1, out)\n        self.assertIn("REF-EXISTS", out)\n'''
          if old not in t:
              raise SystemExit('reference mutation anchor not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # The corrected cold/warm claim is now carried by its canonical public trap, not a removed private note.
          p = root / 'integrity' / 'claims.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          changed = 0
          for claim in data.get('claims', []):
              for row in claim.get('carried_by', []):
                  if row.get('surface') == 'minefield:mining/2026-07-28-chunked-prefill-vs-cache-replay-experiment.md':
                      row['surface'] = 'minefield:traps/runtime/60-cold-prefill-and-cache-hit-disagree.md'
                      row['state'] = 'corrected/canonical public owner; raw experiment evidence archived privately'
                      changed += 1
          if changed != 1:
              raise SystemExit(f'expected one claim-ledger migration, got {changed}')
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Update workflow prose so the public gate names its new authority.
          p = root / '.github' / 'workflows' / 'integrity.yml'
          t = p.read_text(encoding='utf-8')
          t = t.replace('OPEN_QUESTIONS claims to contain every unsettled question.',
                        'registry/OPEN_TRAP_ISSUES.md tracks every currently open public [trap] issue.')
          p.write_text(t, encoding='utf-8')

          # Strip links from public prose that pointed into the deleted private research tree.
          # Preserve the human-readable label, but never preserve a raw mining filename as the label.
          link_re = re.compile(r'(?P<img>!)?\[(?P<label>[^\]]*)\]\((?P<href>[^)]+)\)')
          raw_path_re = re.compile(r'(?:(?:\.\./)+)?mining/[A-Za-z0-9_.\-/]+')

          def replace_link(m):
              href = m.group('href').strip().split()[0]
              normalized = href.lstrip('./')
              if 'mining/' not in normalized and not normalized.startswith('mining'):
                  return m.group(0)
              label = m.group('label').strip()
              if not label or 'mining/' in label or label.startswith('mining'):
                  label = 'private evidence archive'
              if m.group('img'):
                  return 'private evidence archived'
              return f'{label} *(private evidence archived)*'

          changed_docs = []
          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8')
              new_text = link_re.sub(replace_link, text)
              # Remove any remaining literal raw mining paths from public prose/code spans.
              new_text = raw_path_re.sub('private evidence archive', new_text)
              if new_text != text:
                  md.write_text(new_text, encoding='utf-8')
                  changed_docs.append(str(md))

          # Public-facing explanation: raw staging is private, published registry remains public.
          p = root / 'README.md'
          t = p.read_text(encoding='utf-8')
          marker = '# Model Serving Minefield'
          if marker in t and '## Evidence staging privacy' not in t:
              insert = '''\n\n## Evidence staging privacy\n\nThis public repository contains the canonical published registry and public-safe governance. Raw candidate research, unpublished source harvests, unresolved private evidence, and editorial drafts are staged privately and are **not** stored in this repository. Promotion into this repo is deliberate and sanitized.\n'''
              pos = t.find('\n', t.find(marker))
              t = t[:pos] + insert + t[pos:]
              p.write_text(t, encoding='utf-8')

          p = root / 'CONTRIBUTING.md'
          t = p.read_text(encoding='utf-8')
          if '## Private staging boundary' not in t:
              t += '''\n\n## Private staging boundary\n\nDo not add raw maintainer mining directories, unpublished source-harvest packets, private evidence bundles, or editorial drafts to this public repository. Public contributions should arrive as scrubbed issues/PRs or deliberately adjudicated registry material. The public open-issue governance surface is `registry/OPEN_TRAP_ISSUES.md`.\n'''
              p.write_text(t, encoding='utf-8')

          print(f'updated {len(changed_docs)} markdown document(s) with obsolete private-tree references')
          PY

      - name: Prove no public mining tree or raw mining-file links remain
        run: |
          set -euo pipefail
          test ! -d mining
          if git ls-files 'mining/**' | grep -q .; then
            echo 'tracked public mining files remain' >&2
            exit 1
          fi
          # Public policy/test code may contain the forbidden directory token, but public Markdown must not expose raw mining paths.
          if grep -RInE --include='*.md' '(^|[^A-Za-z0-9_-])((\.\./)+)?mining/[A-Za-z0-9_.\-/]+' .; then
            echo 'raw mining path remains in public Markdown' >&2
            exit 1
          fi

      - name: Run affected integrity checks before committing
        run: |
          set -euo pipefail
          python3 integrity/registry_integrity.py --json >/tmp/registry.json
          python3 integrity/reference_integrity.py >/tmp/reference.txt
          cat >/tmp/issues.json <<'JSON'
          [
            {"number":71,"state":"open","title":"[trap] SGLang answers requests for a model name it does not serve"},
            {"number":72,"state":"open","title":"[trap] Omitting reasoning_effort on SGLang resolves to the MOST expensive setting"},
            {"number":73,"state":"open","title":"[trap] Reload-to-reload score drift was autotune, not the checkpoint"}
          ]
          JSON
          python3 integrity/open_issue_queue.py --issues-json /tmp/issues.json
          python3 -m unittest discover -s integrity/tests -t integrity/tests
          python3 -m unittest discover -s doctor/tests -t doctor/tests
          git diff --check

      - name: Commit public-safe migration
        run: |
          set -euo pipefail
          git config user.name 'blackwellboy-privacy-bot'
          git config user.email '76774064+Blackwellboy@users.noreply.github.com'
          git add -A
          git commit -m 'privacy: replace public mining dependencies with safe governance'
          git push origin HEAD:ops/remove-public-mining-20260830
