name: temporary-qwen38-publication

on:
  push:
    branches:
      - feature/qwen38-27b-minefield-20260815

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: append Qwen3.8 leads and model index
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('leads/LEADS.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          existing = {x['id'] for x in payload['leads']}
          source = '../mining/2026-08-15-qwen38-27b-5090-spark.md'
          new = [
            {
              'id': 'L043',
              'title': 'Qwen3.8 MTP support can be runtime-build specific rather than model-wide',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'runtime',
              'symptom': 'A Qwen3.8-27B lane reports MTP unsupported, leading the operator to conclude the checkpoint or model family cannot use MTP.',
              'possible_mechanism': 'MTP capability can depend on the exact serving build, model-family support code and accepted speculative configuration; the same NVFP4 checkpoint was unsupported on one pinned runtime but passed a depth-1 canary on another.',
              'confirmation_check': 'Pin the exact image/build, inspect its Qwen-family MTP implementation and accepted configuration, then run the same bounded canary with MTP off and at depth 1.',
              'refutation_check': 'Show the same checkpoint and MTP configuration fails as unsupported across the compared runtimes after support code and launch semantics are verified equivalent.',
              'conditional_mitigation': 'Change runtime or speculative configuration only after localizing the unsupported boundary; do not describe one runtime result as a Qwen3.8 model limitation.',
              'related_traps': ['09', '28', '71'],
              'affected_stacks': ['Qwen3.8-27B', 'vLLM', 'aeon-vllm', 'DGX Spark', 'MTP'],
              'source_refs': [source],
              'confidence': 'high',
              'notes': 'Aeon NVFP4 stage reported MTP_UNSUPPORTED; Drowzeys vLLM development image exposed Qwen-family MTP support and passed MTP1 on the same NVFP4 revision. Later depths were not claimed from the early checkpoint.'
            },
            {
              'id': 'L044',
              'title': 'amd64 benchmark images fail natively on arm64 DGX Spark before the model is tested',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'evaluation_runtime',
              'symptom': 'A benchmark or helper container on DGX Spark dies immediately with exec format error and the run appears to be a model or benchmark failure.',
              'possible_mechanism': 'The benchmark image can be built for amd64 while the DGX Spark host is aarch64, so native execution fails before any request reaches the served model.',
              'confirmation_check': 'Record host architecture and inspect the architecture of every benchmark/helper image; reproduce the failure with a harmless container command before contacting the model endpoint.',
              'refutation_check': 'Show host and image architectures are compatible, the helper process starts normally, and the failure occurs only after a model request is actually sent.',
              'conditional_mitigation': 'Use a native arm64/multi-arch benchmark image or an explicitly qualified emulation path; do not score the model from a pre-endpoint exec-format failure.',
              'related_traps': ['08', '09', '52'],
              'affected_stacks': ['Docker', 'ProgramBench', 'DGX Spark', 'aarch64', 'evaluation harnesses'],
              'source_refs': [source],
              'confidence': 'high',
              'notes': 'Observed with an amd64 task_cleanroom_v6 image on an aarch64 Spark host; native run returned exec format error and the campaign held the benchmark.'
            },
            {
              'id': 'L045',
              'title': 'Docker save/load can preserve runtime content while the local image ID differs from the source repo digest',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'runtime_versioning',
              'symptom': 'A transferred serving image is rejected as the wrong build because its local Docker .Id does not equal the registry digest pinned before docker save/load.',
              'possible_mechanism': 'Docker local config identity and registry RepoDigest are not interchangeable identity predicates after image transport; equivalent RootFS layers and runtime configuration can survive while the local ID representation differs.',
              'confirmation_check': 'Compare architecture, ordered RootFS layer digests or a stable layer fingerprint, pinned runtime/version environment and load-bearing image labels against the source pin.',
              'refutation_check': 'Show a load-bearing layer/config fingerprint differs, the expected runtime/version label is absent, or the transferred image executes different code.',
              'conditional_mitigation': 'Keep the source registry digest as provenance but verify post-transfer content identity with immutable layers/config rather than requiring local .Id equality alone.',
              'related_traps': ['09'],
              'affected_stacks': ['Docker', 'container image transfer', 'DGX Spark', 'aeon-vllm'],
              'source_refs': [source],
              'confidence': 'high',
              'notes': 'Campaign verifier was repaired to use a 46-layer fingerprint, architecture, aeon version environment and GB10/SM121 labels instead of LOCAL_ID == source digest.'
            },
            {
              'id': 'L046',
              'title': 'Container ENTRYPOINT can reinterpret a model path as a CLI subcommand',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'runtime_launch',
              'symptom': "A vLLM-derived container exits before model load with 'Usage: serve ...' and 'No such command /model'.",
              'possible_mechanism': 'The image ENTRYPOINT already invokes a serve CLI whose argv contract differs from the launcher assumption, so appending /model places the model path in a subcommand position.',
              'confirmation_check': 'Inspect Docker Entrypoint and Cmd, run the image help path, and record the exact final argv; compare with a corrected invocation that reaches a bounded model canary.',
              'refutation_check': 'Show the final argv matches the image CLI contract and the same No-such-command failure persists after the model path is passed in the documented position.',
              'conditional_mitigation': 'Adapt the launcher to the image entrypoint contract rather than changing weights or runtime support code.',
              'related_traps': ['09', '112'],
              'affected_stacks': ['Docker', 'vLLM', 'DGX Spark', 'Qwen3.8-27B'],
              'source_refs': [source],
              'confidence': 'high',
              'notes': 'The same pinned image/checkpoint later returned BLACKWELL38_READY after launch construction was corrected. A separate truendocker shell-concatenation typo is not merged into this mechanism.'
            },
            {
              'id': 'L047',
              'title': 'A telemetry Thread._stop name collision can crash a soak worker at teardown while the endpoint remains healthy',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'evaluation_harness',
              'symptom': 'A long model soak serves requests, then the worker crashes during thread join/teardown and the run is mistaken for serving instability.',
              'possible_mechanism': 'A threading.Thread subclass can shadow the inherited private _stop() method by assigning a threading.Event to self._stop; Thread.join later attempts to call the Event as a method.',
              'confirmation_check': 'Inspect the worker traceback and Thread subclass fields; preserve request/server telemetry separately; rename the field and rerun an offline join regression plus the bounded soak.',
              'refutation_check': 'Show the server itself restarted/died or requests failed before harness teardown, or reproduce the worker crash without any Thread private-name collision.',
              'conditional_mitigation': 'Fix the harness lifecycle bug and rerun; do not change model/runtime configuration on the basis of a teardown-only worker exception.',
              'related_traps': ['52', '107'],
              'affected_stacks': ['Python threading', 'evaluation harnesses', 'soak tests', 'DGX Spark'],
              'source_refs': [source],
              'confidence': 'high',
              'notes': 'After _stop was renamed to _stop_event, the recovered Qwen3.8 BF16 Spark soak completed about two hours with 512/512 successful requests and zero server restarts.'
            },
            {
              'id': 'L048',
              'title': 'One Qwen3.8 Q4 decimal canary failure did not reproduce on the immediate pinned rerun',
              'canonical': False,
              'status': 'FIRST_PARTY_OBSERVED_UNPROMOTED',
              'source_class': 'first_party_campaign',
              'scope': 'evaluation_correctness',
              'symptom': 'A simple decimal-comparison canary on a Qwen3.8 Q4_K_M llama.cpp lane returns the wrong number once and is immediately labelled quantization corruption.',
              'possible_mechanism': 'The bad response is real but a single response does not localize cause; sampling/defaults, runtime variance, prompt path or quantization remain competing explanations when the immediate pinned rerun passes.',
              'confirmation_check': 'Capture the exact provider-bound request, effective sampling/defaults and raw output, then repeat the same canary across enough runs and compare a higher-precision or otherwise controlled arm.',
              'refutation_check': 'If repeated exact requests stay clean and no quant-specific A/B localizes the failure, refute the quant-corruption causal label while retaining the original bad response as an observation.',
              'conditional_mitigation': 'Do not change the quant or checkpoint from n=1; first make the failure repeatable and localize it with a controlled arm.',
              'related_traps': ['21', '35'],
              'affected_stacks': ['Qwen3.8-27B', 'GGUF', 'Q4_K_M', 'llama.cpp', 'RTX 5090'],
              'source_refs': [source],
              'confidence': 'medium',
              'notes': 'Pinned campaign first returned 9.11 on the decimal canary and held; the immediate rerun returned 9.9 and passed. Cause was not isolated.'
            }
          ]
          for lead in new:
              if lead['id'] not in existing:
                  payload['leads'].append(lead)
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index = Path('models/README.md')
          text = index.read_text(encoding='utf-8')
          if 'Qwen 3.8 27B ([full page]' not in text:
              lines = text.splitlines()
              insert_at = None
              for i, line in enumerate(lines):
                  if line.startswith('| Qwen 3.6 27B (Q4_K_M, llama.cpp)'):
                      insert_at = i + 1
                      break
              if insert_at is None:
                  raise SystemExit('Qwen 3.6 anchor row not found')
              row = '| Qwen 3.8 27B ([full page](qwen3.8-27b.md)): Q4_K_M on RTX 5090; BF16/FP8/NVFP4 on DGX Spark; aeon-vLLM, llama.cpp and experimental vLLM coverage | Public L-series campaign leads [L043–L048](../leads/README.md) cover runtime-specific MTP support, amd64 benchmark images on arm64 Spark, post-save/load Docker identity, container ENTRYPOINT argv mismatches, soak-thread teardown crashes, and a one-off decimal canary that did not immediately reproduce; also check generic traps [09](../traps/runtime/09-image-choice-changes-outcome.md), [10](../traps/quantization/10-quant-label-is-not-the-kernel-path.md), [52](../traps/evaluation/52-speed-measured-on-a-broken-config.md), [112](../traps/runtime/112-process-liveness-is-not-model-readiness.md) |'
              lines.insert(insert_at, row)
              index.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: regenerate public package and agent surfaces
        run: python -m minefield agent-bundle
      - name: run focused tests
        run: |
          python -m unittest tests.test_leads_catalog tests.test_leads_integration tests.test_qwen38_leads
      - name: commit generated/publication changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- leads/LEADS.json models/README.md minefield/data/UNVERIFIED_LEADS.json dist registry/diagnostic_coverage.json registry/guided_experiments.json web/registry-data.js skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish Qwen3.8 lead routing and generated surfaces'
          git push origin HEAD:feature/qwen38-27b-minefield-20260815
