name: temporary-qwen38-link-fix

on:
  push:
    branches:
      - feature/qwen38-27b-minefield-20260815

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: replace fixture-unsafe cross-directory lead link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('models/README.md')
          text = p.read_text(encoding='utf-8')
          old = '[L043–L048](../leads/README.md)'
          new = '[L043–L048](qwen3.8-27b.md#qwen38-27b-troubleshooting-leads)'
          if old not in text:
              raise SystemExit('expected Qwen3.8 L-series link not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: regenerate deterministic agent surfaces
        run: python -m minefield agent-bundle
      - name: run reference mutation control and Qwen lead tests
        run: |
          python -m unittest integrity.tests.test_reference_mutations.ReferenceMutations.test_00_clean_tree_passes
          python -m unittest tests.test_qwen38_leads tests.test_leads_catalog tests.test_leads_integration
      - name: commit fix and generated artefacts
        shell: bash
        run: |
          set -euo pipefail
          git add -- models/README.md dist skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep Qwen3.8 model-index lead link fixture-safe'
          git push origin HEAD:feature/qwen38-27b-minefield-20260815
