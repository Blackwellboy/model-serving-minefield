name: one-shot fingerprint benchmark and regeneration

on:
  push:
    branches:
      - feature/fingerprints-doctor29-20261008

permissions:
  contents: write

jobs:
  build-and-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Regenerate
        run: |
          python -m pip install "jinja2>=3.1"
          python -m minefield agent-bundle
      - name: Benchmark fingerprints
        run: |
          python benchmarks/run_symptom_benchmark.py
          echo "--- misses ---"
          python benchmarks/run_symptom_benchmark.py --misses
      - name: Remove one-shot workflow and commit generated surfaces
        run: |
          rm .github/workflows/fingerprint-benchmark.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "build: regenerate fingerprint registry surfaces"
          git push
