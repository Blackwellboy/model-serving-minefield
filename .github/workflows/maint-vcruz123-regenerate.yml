name: maint-vcruz123-regenerate

on:
  push:
    branches:
      - maint/integrate-vcruz-trap123-20260820

permissions:
  contents: write

jobs:
  adjudicate-and-regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip vcruz regen]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: maint/integrate-vcruz-trap123-20260820
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: add Victor Cruz to measured-contributor hall of fame
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('HALL_OF_FAME.md')
          text = p.read_text(encoding='utf-8')
          if '**@vcruz305**' not in text:
              anchor = '| **@tonyd2wild** |'
              row = ('| **@vcruz305** (Victor Cruz) | Found the vLLM V1 EngineCore orphan lifecycle failure on DGX Spark and contributed its runnable ownership probe; earlier authored the F16 embedding patch chain and instrumentation that turned Trap 116 from “old error disappeared” into positive first-forward runtime proof, with Blackwellboy retaining the external multi-node qualification credit | [123](traps/runtime/123-vllm-v1-enginecore-orphan-holds-gpu-memory.md), [116](traps/runtime/116-successful-load-does-not-prove-first-forward-dtype-path.md) |\n')
              if anchor not in text:
                  raise SystemExit('Hall-of-fame insertion anchor not found')
              text = text.replace(anchor, row + anchor, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: regenerate deterministic Minefield surfaces
        run: |
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
          git diff --check

      - name: commit adjudication-generated surfaces
        run: |
          git config user.name "blackwellboy"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -- HALL_OF_FAME.md \
            dist \
            minefield/data \
            registry \
            web/registry-data.js \
            skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Credit Victor Cruz and regenerate Trap 123 surfaces [skip vcruz regen]"
          git push origin HEAD:maint/integrate-vcruz-trap123-20260820
