name: temporary-regenerate-lead-pack

on:
  push:
    branches:
      - feature/unverified-lead-layer-20260814

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: regenerate deterministic agent pack
        run: python -m minefield agent-bundle
      - name: commit generated artefacts when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- dist
          if git diff --cached --quiet; then
            echo "Generated artefacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh pack after lead matcher fix"
          git push origin HEAD:feature/unverified-lead-layer-20260814
