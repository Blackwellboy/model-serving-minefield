name: release-artifacts

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          python -m minefield agent-bundle --verify
          python -m unittest discover -s tests
          python -m pip install build==1.4.0
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          minefield coverage --json
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' | minefield-mcp
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MINEFIELD_AGENT_BUNDLE.md
            dist/MINEFIELD_AGENT_BUNDLE_LITE.md
            dist/MINEFIELD_AGENT_BUNDLE.json
            dist/MINEFIELD_REGISTRY.json
            dist/MINEFIELD_REGISTRY.min.json
            dist/model-serving-minefield-agent-pack.zip
            dist/MANIFEST.txt
            dist/SHA256SUMS
            dist/*.whl
            dist/*.tar.gz
