name: pr56-regenerate-generated

on:
  push:
    branches:
      - maint/tonyd2wild-deepseek-v4-harvest-20260821

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Regenerate canonical derived surfaces
        run: |
          python -m minefield agent-bundle
          git diff --check
          git add -- \
            dist \
            minefield/data \
            registry/diagnostic_coverage.json \
            registry/guided_experiments.json \
            web/registry-data.js \
            skills/model-serving-minefield/references/agent-bundle.md
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Minefield derived registry surfaces"
          git push origin HEAD:maint/tonyd2wild-deepseek-v4-harvest-20260821
