name: tmp-integrate-jschmied-qwen38-budget

on:
  push:
    branches:
      - maint/integrate-jschmied-qwen38-budget-lead-20260825

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Add bounded L050 and Qwen model routing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('leads/LEADS.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ids = {x['id'] for x in data['leads']}
          if 'L050' not in ids:
              data['leads'].append({
                  'id': 'L050',
                  'title': 'Sampler-enforced thinking budgets can bound Qwen3.8 reasoning without redefining the effort prompt',
                  'canonical': False,
                  'status': 'PUBLIC_SOURCE_UNREPRODUCED',
                  'source_class': 'community_public_source',
                  'scope': 'reasoning_runtime',
                  'symptom': 'Qwen3.8 at a high reasoning-effort setting can consume the entire completion budget inside thinking and return empty final content, while prompt-only effort labels provide no hard reasoning-token ceiling.',
                  'possible_mechanism': 'vLLM 0.27.1 exposes thinking_token_budget and implements sampler-side tracking that forces the configured end-of-thinking token sequence when the budget is exhausted; this separates an engine-enforced reasoning budget from prompt wording such as xhigh.',
                  'confirmation_check': 'On one pinned Qwen3.8 checkpoint/runtime, hold explicit reasoning_effort, max completion tokens, sampling and prompt constant; compare no budget versus a fixed thinking_token_budget while recording rendered prompt, reasoning/content token counts, finish reason, correctness and latency.',
                  'refutation_check': 'Show the exact vLLM build lacks the budget path, the request does not reach it, or a matched budget-vs-no-budget A/B fails to change the reasoning-limit behavior despite the sampler control being active.',
                  'conditional_mitigation': 'Where the pinned vLLM build and reasoning parser support it, prefer an explicitly measured sampler-side thinking budget over relying on an unbounded xhigh prompt instruction; do not retrofit the setting into historical benchmark arms.',
                  'related_traps': ['03', '07', '16'],
                  'affected_stacks': ['Qwen3.8-27B', 'vLLM 0.27.1', 'reasoning parser', 'DGX Spark GB10'],
                  'source_refs': [
                      '../mining/2026-08-20-jschmied-qwen38-fixed-template-reconciliation.md',
                      'https://github.com/jschmied/Qwen-Fixed-Chat-Templates',
                      'https://github.com/vllm-project/vllm/blob/v0.27.1/vllm/v1/sample/thinking_budget_state.py',
                      'https://github.com/vllm-project/vllm/blob/v0.27.1/vllm/entrypoints/openai/chat_completion/protocol.py'
                  ],
                  'confidence': 'high',
                  'notes': 'Implementation existence is source-confirmed in vLLM 0.27.1. The reported Qwen3.8 GB10 numeric A/B (no budget: 97,708 reasoning chars / 0 content; budget 1500: 5,562 reasoning chars / 18,512 content) remains external contributor measurement and has not been reproduced by Blackwellboy.'
              })
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          mp = Path('models/qwen3.8-27b.md')
          text = mp.read_text(encoding='utf-8')
          marker = '## External template corroboration and sampler-side thinking budget (2026-08-20)'
          if marker not in text:
              text += '''\n\n## External template corroboration and sampler-side thinking budget (2026-08-20)\n\nA public review of [`jschmied/Qwen-Fixed-Chat-Templates`](https://github.com/jschmied/Qwen-Fixed-Chat-Templates) independently agrees with two template-control findings already reproduced here on a different Qwen3.8 pin: unset `reasoning_effort` can render as explicit **xhigh**, and `medium` can be an accepted **no-dedicated-instruction** branch. See the [full reconciliation note](../mining/2026-08-20-jschmied-qwen38-fixed-template-reconciliation.md).\n\nThe useful new runtime control is **L050**: vLLM 0.27.1 source exposes `thinking_token_budget` and sampler-side state that forces the end-of-thinking token sequence when the budget is exhausted. The implementation fact is source-confirmed; jschmied's Qwen3.8 GB10 numeric A/B remains external/unreproduced here. Treat it as a new controlled variable, not a retrofit to historical campaign arms.\n\nDo **not** treat the external template's custom `minimal`, `high`, `max`, unknown-value mappings or xhigh prompt wording as native Qwen3.8 semantics. Its current file also still carries the historical-reasoning replay / empty-think-block hazards already owned by Trap 04 and Trap 25 extensions.\n'''
              mp.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and validate current tree
        run: |
          set -euxo pipefail
          python3 -m minefield agent-bundle
          python3 -m minefield agent-bundle --verify
          git diff --check
          python3 integrity/registry_integrity.py
          python3 integrity/reference_integrity.py
          python3 integrity/upstream_integrity.py
          python3 -m unittest discover -s tests

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/tmp-integrate-jschmied-qwen38-budget.yml
          git config user.name "blackwellboy-maint-bot"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate jschmied Qwen3.8 thinking-budget lead"
          git push origin HEAD:maint/integrate-jschmied-qwen38-budget-lead-20260825
