name: pr123-regenerate-artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    if: ${{ github.event.pull_request.head.ref == 'integration/trap139-switchless-nccl-alex' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Patch source in the runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('minefield/registry.py')
          text = registry.read_text(encoding='utf-8')
          old = '''def _clean(text: str, limit: int = 2400) -> str:\n    text = re.sub(r"```.*?```", " ", text, flags=re.S)\n    text = re.sub(r"<!--.*?-->", " ", text, flags=re.S)\n    text = re.sub(r"\\[([^\\]]+)\\]\\([^)]+\\)", r"\\1", text)\n    text = re.sub(r"[`*_#]", "", text)\n    return re.sub(r"\\s+", " ", text).strip()[:limit]\n'''
          new = '''def _clean(text: str, limit: int = 2400) -> str:\n    text = re.sub(r"```.*?```", " ", text, flags=re.S)\n    text = re.sub(r"<!--.*?-->", " ", text, flags=re.S)\n    text = re.sub(r"\\[([^\\]]+)\\]\\([^)]+\\)", r"\\1", text)\n\n    # Preserve literal inline-code payloads before removing Markdown emphasis.\n    # Environment variables and other machine identifiers commonly contain\n    # underscores; stripping those characters changes the identifier itself.\n    inline_code: list[str] = []\n\n    def stash_inline_code(match: re.Match[str]) -> str:\n        inline_code.append(match.group(1))\n        return f"\\uE000{len(inline_code) - 1}\\uE001"\n\n    text = re.sub(r"`([^`\\n]+)`", stash_inline_code, text)\n    text = re.sub(r"[*_#]", "", text)\n    for index, value in enumerate(inline_code):\n        text = text.replace(f"\\uE000{index}\\uE001", value)\n    return re.sub(r"\\s+", " ", text).strip()[:limit]\n'''
          if old not in text:
              raise SystemExit('registry.py _clean block did not match expected head')
          registry.write_text(text.replace(old, new), encoding='utf-8')

          contract = Path('minefield/diagnosis_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '''    topology = []\n    if node_count:\n        topology.extend("single-node" if item == "1" else f"{item}-node" for item in node_count)\n    topology.extend(parallelism)\n'''
          new = '''    topology = []\n    if node_count:\n        topology.extend("single-node" if item == "1" else f"{item}-node" for item in node_count)\n    # A switchless fabric is a direct-cable topology class, not merely an\n    # implementation detail. Encoding it makes switched-fabric observations\n    # a critical topology mismatch instead of an undocumented condition.\n    if re.search(r"\\bswitchless\\b", lower):\n        topology.append("switchless-direct-cable")\n    if re.search(r"\\bmulti[- ]nic\\b", lower):\n        topology.append("multi-nic")\n    topology.extend(parallelism)\n'''
          if old not in text:
              raise SystemExit('diagnosis_contract.py topology block did not match expected head')
          contract.write_text(text.replace(old, new), encoding='utf-8')

          Path('tests/test_registry_generation_regressions.py').write_text('''import unittest\n\nfrom minefield.diagnosis_contract import compare_conditions\nfrom minefield.registry import ROOT, _clean, compile_registry\n\n\nclass RegistryGenerationRegressionTests(unittest.TestCase):\n    def test_inline_code_identifiers_preserve_underscores(self):\n        cleaned = _clean("Use `NCCL_IB_GID_INDEX=3` with **verified** ports.")\n        self.assertIn("NCCL_IB_GID_INDEX=3", cleaned)\n        self.assertNotIn("NCCLIBGIDINDEX", cleaned)\n\n    def test_trap139_encodes_switchless_topology(self):\n        registry = compile_registry(ROOT)\n        trap = next(entry for entry in registry["entries"] if entry["id"] == "139")\n        topology = trap["applicability"]["topology"]\n        self.assertIn("switchless-direct-cable", topology)\n        self.assertIn("multi-nic", topology)\n\n        _, mismatched, _ = compare_conditions(\n            trap["applicability"], {"topology": "switched-fabric"}\n        )\n        self.assertTrue(any(item.startswith("topology:") for item in mismatched))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Test and regenerate
        run: |
          python -m unittest tests.test_registry_generation_regressions
          python -m unittest discover -s tests
          python -m unittest discover -s integrity/tests -t integrity/tests
          python -m unittest discover -s doctor/tests -t doctor/tests
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
          git diff --check

      - name: Package the exact proposed tree changes
        run: |
          mkdir -p /tmp/proposed
          (git diff --name-only; git ls-files --others --exclude-standard) | sort -u > /tmp/proposed-files.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "/tmp/proposed/$(dirname "$path")"
            cp "$path" "/tmp/proposed/$path"
          done < /tmp/proposed-files.txt
          cp /tmp/proposed-files.txt /tmp/proposed/FILES.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr123-proposed-tree
          path: /tmp/proposed
          if-no-files-found: error
