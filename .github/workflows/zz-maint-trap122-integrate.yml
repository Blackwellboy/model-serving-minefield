name: maint-trap122-integration

on:
  push:
    branches:
      - "maint/integrate-trap122-cudagraph-20260818"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply adjudication
        run: python scripts/maint_trap122_integrate.py
      - name: Regenerate deterministic surfaces
        run: python -m minefield agent-bundle
      - name: Focused validation
        shell: bash
        run: |
          python integrity/registry_integrity.py
          python integrity/reference_integrity.py
          python integrity/upstream_integrity.py
          python -m minefield agent-bundle --verify
          python -m unittest discover -s tests
          python -m unittest discover -s integrity/tests -t integrity/tests
          if grep -R --exclude-dir=.git -n '122-mtp-turboquant-kv-corrupts-output.md' .; then
            echo 'stale provisional Trap 122 slug remains' >&2
            exit 1
          fi
      - name: Commit final integration
        shell: bash
        run: |
          rm .github/workflows/zz-maint-trap122-integrate.yml
          rm scripts/maint_trap122_integrate.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Adjudicate Trap 122 as CUDA-graph MTP verification failure'
          git push origin HEAD:${GITHUB_REF_NAME}
