name: maint-open-queue-regenerate

on:
  push:
    branches:
      - maint/open-queue-governance-20260820

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip regen]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: maint/open-queue-governance-20260820
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: regenerate deterministic agent artefacts
        run: |
          python -m minefield agent-bundle
          python -m minefield agent-bundle --verify
          git diff --check

      - name: commit generated artefacts only
        run: |
          git config user.name "blackwellboy"
          git config user.email "76774064+Blackwellboy@users.noreply.github.com"
          git add -- dist/MANIFEST.txt dist/SHA256SUMS dist/model-serving-minefield-agent-pack.zip
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Regenerate agent-pack inventory for lead docs [skip regen]"
          git push origin HEAD:maint/open-queue-governance-20260820
